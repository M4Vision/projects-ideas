<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Projets Web — Portfolio d'entraînement</title>
	<script src="data.js"></script>
	<style>
		:root {
			--bg: #0A0A0A;
			--fg: #EDEDED;
			--border: #232323;
			--accent: #3B82F6;
			--accent-hover: #2563EB;
			--card: #141414;
			--card-hover: #1A1A1A;
			--text-secondary: #888;
			--radius: 8px;
			--shadow: 0 0 0 1px var(--border)
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			scrollbar-width: thin;
			scrollbar-color: #555 transparent
		}
		*::-webkit-scrollbar{width:8px;height:8px}
		*::-webkit-scrollbar-track{background:transparent}
		*::-webkit-scrollbar-thumb{background:#555;border-radius:4px}
		*::-webkit-scrollbar-thumb:hover{background:#777}
		*::-webkit-scrollbar-corner{background:transparent}

		body {
			font-family: system-ui, -apple-system, sans-serif;
			background: var(--bg);
			color: var(--fg);
			min-height: 100vh
		}

		.header {
			position: sticky;
			top: 0;
			z-index: 100;
			background: var(--bg);
			border-bottom: 1px solid var(--border);
			padding: 12px 24px;
			display: flex;
			align-items: center;
			gap: 16px
		}

		.header h1 {
			font-size: 18px;
			font-weight: 600
		}

		.header .nav {
			display: flex;
			gap: 4px;
			flex-wrap: wrap
		}

		.header .nav a {
			padding: 6px 14px;
			border-radius: var(--radius);
			font-size: 13px;
			color: var(--text-secondary);
			text-decoration: none;
			cursor: pointer;
			transition: all .15s
		}

		.header .nav a:hover,
		.header .nav a.active {
			color: var(--fg);
			background: var(--card)
		}

		.header .utils {
			display: flex;
			gap: 8px;
			align-items: center;
			margin-left: auto
		}

		.viewport-btns {
			display: flex;
			gap: 4px
		}

		.viewport-btn {
			padding: 6px 10px;
			border-radius: var(--radius);
			font-size: 11px;
			font-family: monospace;
			border: 1px solid var(--border);
			background: transparent;
			color: var(--text-secondary);
			cursor: pointer;
			transition: all .15s
		}

		.viewport-btn:hover,
		.viewport-btn.active {
			color: var(--fg);
			border-color: var(--accent);
			background: var(--card)
		}

		.main {
			display: flex;
			height: calc(100vh - 57px)
		}

		.sidebar {
			width: 260px;
			border-right: 1px solid var(--border);
			padding: 16px;
			overflow-y: auto;
			flex-shrink: 0
		}

		.sidebar h2 {
			font-size: 11px;
			text-transform: uppercase;
			color: var(--text-secondary);
			letter-spacing: 1px;
			margin-bottom: 12px
		}

		.project-group {
			margin-bottom: 24px
		}

		.project-group .project-title {
			font-size: 14px;
			font-weight: 600;
			margin-bottom: 8px;
			display: flex;
			align-items: center;
			gap: 8px;
			cursor: pointer;
			padding: 6px 8px;
			border-radius: var(--radius);
			transition: all .15s
		}

		.project-group .project-title:hover {
			background: var(--card)
		}

		.project-group .project-title .icon {
			font-size: 16px
		}

		.theme-list {
			list-style: none;
			margin-left: 4px
		}

		.theme-list li {
			padding: 6px 8px 6px 28px;
			font-size: 13px;
			border-radius: var(--radius);
			cursor: pointer;
			color: var(--text-secondary);
			transition: all .15s;
			position: relative
		}

		.theme-list li:hover {
			color: var(--fg);
			background: var(--card)
		}

		.theme-list li.active {
			color: var(--accent);
			background: var(--card)
		}

		.theme-list li.active::before {
			content: '';
			position: absolute;
			left: 8px;
			top: 50%;
			transform: translateY(-50%);
			width: 3px;
			height: 16px;
			background: var(--accent);
			border-radius: 2px
		}

		.preview {
			flex: 1;
			display: flex;
			flex-direction: column;
			padding: 12px;
			background: #000;
			min-width: 0
		}

		.preview .info-bar {
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 8px 12px;
			margin-bottom: 8px;
			background: var(--card);
			border-radius: var(--radius);
			font-size: 13px;
			color: var(--text-secondary)
		}

		.preview .info-bar strong {
			color: var(--fg)
		}

		.preview .info-bar a {
			color: var(--accent);
			text-decoration: none
		}

		.preview .info-bar a:hover {
			text-decoration: underline
		}

		.preview iframe {
			flex: 1;
			width: 100%;
			border: 1px solid var(--border);
			border-radius: var(--radius);
			background: #fff;
			transition: width .3s
		}

		.status-dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			display: inline-block;
			margin-right: 6px
		}

		.status-dot.green {
			background: #22C55E
		}

		.status-dot.yellow {
			background: #EAB308
		}

		.code-panel {
			display: none;
			flex: 1;
			flex-direction: column;
			background: var(--card);
			border-radius: var(--radius);
			overflow: hidden
		}

		.code-panel.active {
			display: flex
		}

		.code-toolbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 8px 16px;
			background: var(--bg);
			border-bottom: 1px solid var(--border);
			color: var(--text-secondary);
			font-size: 13px
		}

		.code-content {
			flex: 1;
			overflow: auto;
			padding: 16px;
			font-size: 13px;
			line-height: 1.6
		}

		.code-content pre {
			margin: 0;
			tab-size: 2;
			white-space: pre;
			word-break: normal;
			background: transparent !important
		}

		.code-content code {
			font-family: 'Fira Code', 'Courier New', monospace;
			white-space: pre;
			counter-reset: line
		}

		.code-content .line::before {
			counter-increment: line;
			content: counter(line);
			display: inline-block;
			width: 4ch;
			text-align: right;
			padding-right: 1.5em;
			color: var(--text-secondary);
			user-select: none
		}

		.markdown-body {
			color: #eee;
			line-height: 1.8;
			max-width: 720px;
			margin: 0 auto;
			padding: 32px 24px 64px
		}
		.markdown-body h1,
		.markdown-body h2,
		.markdown-body h3,
		.markdown-body h4 {
			color: #9d7cd8;
			margin: 1.5em 0 .5em;
			font-weight: 600
		}
		.markdown-body h1 {
			font-size: 1.8em;
			border-bottom: 1px solid #404040;
			padding-bottom: .3em
		}
		.markdown-body h2 {
			font-size: 1.4em;
			border-bottom: 1px solid #404040;
			padding-bottom: .3em
		}
		.markdown-body h3 {
			font-size: 1.15em
		}
		.markdown-body p {
			margin: 0 0 1em
		}
		.markdown-body ul {
			padding-left: 2em;
			margin: 0 0 1em
		}
		.markdown-body ul li::marker {
			color: #fab283
		}
		.markdown-body ol {
			padding-left: 2em;
			margin: 0 0 1em;
			color: #56b6c2
		}
		.markdown-body li {
			margin: .25em 0;
			color: #eee
		}
		.markdown-body code {
			background: #1a1a1a;
			padding: 2px 6px;
			border-radius: 3px;
			font-size: .9em;
			color: #7fd88f
		}
		.markdown-body pre {
			background: #0a0a0a;
			padding: 16px;
			border-radius: 6px;
			overflow-x: auto;
			margin: 0 0 1em;
			border: 1px solid #333
		}
		.markdown-body pre code {
			background: none;
			padding: 0;
			font-size: .85em;
			color: #eee
		}
		.markdown-body .shiki {
			background: #0a0a0a !important;
			padding: 16px;
			border-radius: 6px;
			overflow-x: auto;
			margin: 0 0 1em;
			border: 1px solid #333;
			line-height: 1.5
		}
		.markdown-body .shiki code {
			background: none;
			padding: 0;
			color: inherit
		}
		.markdown-body a {
			color: #fab283
		}
		.markdown-body a:hover {
			text-decoration: underline
		}
		.markdown-body blockquote {
			border-left: 3px solid #56b6c2;
			padding-left: 1em;
			color: #e5c07b;
			margin: 0 0 1em
		}
		.markdown-body table {
			border-collapse: collapse;
			margin: 0 0 1em;
			width: 100%
		}
		.markdown-body th,
		.markdown-body td {
			border: 1px solid #404040;
			padding: 8px 12px;
			text-align: left;
			color: #eee
		}
		.markdown-body th {
			background: #1a1a1a;
			font-weight: 600;
			color: #f5a742
		}
		.markdown-body hr {
			border: none;
			border-top: 1px solid #808080;
			margin: 1.5em 0
		}
		.markdown-body img {
			max-width: 100%;
			border-radius: 6px
		}
		.markdown-body strong {
			color: #f5a742
		}
		.markdown-body em {
			color: #e5c07b
		}
		.markdown-body .mermaid {
			background: #0a0a0a;
			border-radius: 6px;
			padding: 16px;
			margin: 0 0 1em;
			overflow-x: auto;
			border: 1px solid #333
		}
		.markdown-body .mermaid svg {
			max-width: 100%;
			display: block;
			margin: 0 auto
		}

		#apiContainer {
			font-family: system-ui, -apple-system, sans-serif
		}

		.view-btn {
			padding: 4px 10px;
			font-size: 11px;
			border: 1px solid var(--border);
			border-radius: 4px;
			background: transparent;
			color: var(--text-secondary);
			cursor: pointer;
			transition: all .15s;
			white-space: nowrap
		}

		.view-btn:hover,
		.view-btn.active {
			color: var(--fg);
			border-color: var(--accent);
			background: var(--card)
		}

		.preview .info-bar .nav-views {
			display: flex;
			gap: 4px;
			margin-left: auto
		}

		@media(max-width:768px) {
			.sidebar {
				display: none
			}

			.header .nav {
				display: none
			}

			.header h1 {
				font-size: 14px
			}
		}

		#codeContent>pre {
			overflow-x: auto;
		}

		.tester-bar {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 12px 0;
			border-bottom: 1px solid var(--border);
			margin-bottom: 16px;
			flex-wrap: wrap
		}
		.tester-bar label {
			font-size: 13px;
			color: var(--text-secondary);
			white-space: nowrap
		}
		.tester-input {
			flex: 1;
			min-width: 200px;
			padding: 7px 12px;
			font-size: 13px;
			font-family: monospace;
			background: var(--bg);
			border: 1px solid var(--border);
			border-radius: 4px;
			color: var(--fg);
			outline: none
		}
		.tester-input:focus {
			border-color: var(--accent)
		}
		.tester-progress-bar {
			height: 4px;
			background: var(--border);
			border-radius: 2px;
			overflow: hidden;
			position: relative
		}
		.tester-progress-fill {
			height: 100%;
			width: 40%;
			background: linear-gradient(90deg, var(--accent), var(--accent-hover));
			border-radius: 2px;
			position: absolute;
			animation: tester-indeterminate 1.5s ease-in-out infinite
		}
		@keyframes tester-indeterminate {
			0% { left: -40% }
			100% { left: 100% }
		}
		.tester-category {
			margin-bottom: 8px;
			border: 1px solid var(--border);
			border-radius: 6px;
			overflow: hidden
		}
		.tester-category-header {
			padding: 10px 14px;
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 14px;
			font-weight: 600;
			user-select: none;
			background: var(--card)
		}
		.tester-category-header:hover {
			background: var(--card-hover)
		}
		.tester-category-header.pass {
			color: #22C55E
		}
		.tester-category-header.fail {
			color: #EF4444
		}
		.tester-category-count {
			margin-left: auto;
			font-size: 12px;
			font-weight: 400
		}
		.tester-test-list {
			border-top: 1px solid var(--border)
		}
		.tester-test {
			padding: 8px 14px 8px 36px;
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 13px;
			flex-wrap: wrap
		}
		.tester-test.fail {
			background: rgba(239,68,68,.05)
		}
		.tester-test.error {
			background: rgba(234,179,8,.05)
		}
		.tester-test-name {
			flex: 1
		}
		.tester-test-duration {
			color: var(--text-secondary);
			font-size: 11px;
			font-family: monospace
		}
		.tester-test-error {
			width: 100%;
			margin-top: 4px;
			padding: 6px 10px;
			background: rgba(239,68,68,.1);
			border-radius: 4px;
			color: #e06c75;
			font-size: 12px;
			font-family: monospace;
			white-space: pre-wrap;
			word-break: break-all
		}
		.tester-summary {
			margin-top: 16px;
			padding: 14px;
			border-radius: 6px;
			font-size: 14px;
			line-height: 1.6
		}
		.tester-summary.pass {
			background: rgba(34,197,94,.08);
			color: #22C55E
		}
		.tester-summary.fail {
			background: rgba(239,68,68,.08);
			color: #EF4444
		}
		.tester-status-icon {
			font-size: 14px;
			line-height: 1
		}
	</style>
</head>

<body>
	<div class="header">
		<h1>🏗️ Projets d'entraînement</h1>
		<div class="nav" id="projectNav"></div>
		<div class="utils">
			<div class="viewport-btns">
				<button class="viewport-btn" data-width="100%" onclick="setViewport('100%')">XL</button>
				<button class="viewport-btn" data-width="1024px" onclick="setViewport('1024px')">LG</button>
				<button class="viewport-btn" data-width="768px" onclick="setViewport('768px')">MD</button>
				<button class="viewport-btn" data-width="480px" onclick="setViewport('480px')">SM</button>
				<button class="viewport-btn" data-width="375px" onclick="setViewport('375px')">XS</button>
			</div>
		</div>
	</div>
	<div class="main">
		<div class="sidebar" id="sidebar"></div>
		<div class="preview" id="preview">
			<div class="info-bar" id="infoBar">
				<span id="statusInfo">Sélectionnez un projet et un thème pour commencer</span>
				<div class="nav-views">
					<button class="view-btn active" data-view="preview"
						onclick="window.switchView('preview')">Preview</button>
					<button class="view-btn" data-view="source" onclick="window.switchView('source')">Source</button>
					<button class="view-btn" data-view="prd" onclick="window.switchView('prd')">PRD</button>
					<button class="view-btn" data-view="openapi" onclick="window.switchView('openapi')">OpenAPI</button>
					<button class="view-btn" data-view="apiclient" onclick="window.switchView('apiclient')">API</button>
					<button class="view-btn" data-view="guide" onclick="window.switchView('guide')">Guide</button>
					<button class="view-btn" data-view="tester" onclick="window.switchView('tester')">Testeur</button>
				</div>
			</div>
			<iframe id="previewFrame"></iframe>
			<div class="code-panel" id="codePanel">
				<div class="code-toolbar">
					<span id="codeFileName"></span>
					<div style="display:flex;gap:4px;align-items:center">
						<span id="apiOptions" style="display:none;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary)">
							API: <input id="apiUrlInput" style="width:180px;padding:3px 8px;font-size:12px;background:var(--card);border:1px solid var(--border);border-radius:4px;color:var(--fg);outline:none" />
							Token: <input id="apiTokenInput" style="width:160px;padding:3px 8px;font-size:12px;background:var(--card);border:1px solid var(--border);border-radius:4px;color:var(--fg);outline:none" placeholder="token-1" />
							<button class="view-btn" id="apiResetData" onclick="window.resetApiData()">↺ Reset</button>
						</span>
						<button class="view-btn" id="prdToggle" style="display:none" onclick="window.togglePrdView()">Source</button>
						<button class="view-btn" id="apiToggle" style="display:none" onclick="window.toggleApiView()">Source</button>
						<button class="view-btn" id="guideToggle" style="display:none" onclick="window.toggleGuideView()">Source</button>
						<button class="view-btn" onclick="window.switchView('preview')">✕ Retour</button>
					</div>
				</div>
				<div class="code-content" id="codeContent">
					<div style="color:#888;padding:20px">Charge…</div>
				</div>
				<div id="apiContainer" style="display:none;flex:1;overflow:hidden"></div>
			</div>
		</div>
	</div>

	<script>
		var currentProject = null;
		var currentTheme = null;

		function init() {
			renderNav();
			// Auto-select first project
			if (projectsData.length > 0) selectProject(projectsData[0].id);
		}

		function renderNav() {
			const nav = document.getElementById('projectNav');
			nav.innerHTML = projectsData.map(p =>
				`<a href="#" class="${p.id === currentProject?.id ? 'active' : ''}" onclick="selectProject('${p.id}')">${p.icon} ${p.name}</a>`
			).join('');
		}

		function selectProject(projectId) {
			currentProject = projectsData.find(p => p.id === projectId);
			currentTheme = null;
			renderNav();
			renderSidebar();
			// Auto-select first theme
			if (currentProject && currentProject.themes.length > 0) {
				selectTheme(currentProject.themes[0].id);
			}
		}

		function renderSidebar() {
			const sidebar = document.getElementById('sidebar');
			if (!currentProject) { sidebar.innerHTML = ''; return; }
			sidebar.innerHTML = `
    <h2>${currentProject.icon} ${currentProject.name}</h2>
    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px">${currentProject.description}</p>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px">
      <button onclick="window.switchView('prd')" style="padding:4px 10px;font-size:11px;border:1px solid var(--border);border-radius:4px;color:var(--text-secondary);background:transparent;cursor:pointer">📄 PRD</button>
      <button onclick="window.switchView('openapi')" style="padding:4px 10px;font-size:11px;border:1px solid var(--border);border-radius:4px;color:var(--text-secondary);background:transparent;cursor:pointer">🔌 OpenAPI</button>
      <button onclick="window.switchView('apiclient')" style="padding:4px 10px;font-size:11px;border:1px solid var(--border);border-radius:4px;color:var(--text-secondary);background:transparent;cursor:pointer">🔌 API Client</button>
    </div>
    <h2 style="margin-top:8px">Thèmes</h2>
    <ul class="theme-list">
      ${currentProject.themes.map(t =>
				`<li class="${t.id === currentTheme?.id ? 'active' : ''}" onclick="selectTheme('${t.id}')">
          <span class="status-dot green"></span>${t.name}
          <br><small style="color:var(--text-secondary);font-size:11px">${t.desc}</small>
        </li>`
			).join('')}
    </ul>
  `;
		}

		function selectTheme(themeId) {
			currentTheme = currentProject.themes.find(t => t.id === themeId);
			renderSidebar();
			if (typeof window.switchView === 'function') window.switchView('preview');
			if (currentTheme) {
				const iframe = document.getElementById('previewFrame');
				iframe.src = currentTheme.file;
				document.getElementById('statusInfo').innerHTML =
					`<strong>${currentProject.name}</strong> — ${currentTheme.name} <span style="color:var(--text-secondary)">| ${currentTheme.desc}</span>`;
			}
		}

		function setViewport(width) {
			const iframe = document.getElementById('previewFrame');
			iframe.style.width = width;
			document.querySelectorAll('.viewport-btn').forEach(b => {
				b.classList.toggle('active', b.dataset.width === width);
			});
		}

		document.addEventListener('DOMContentLoaded', init);
	</script>
	<script type="module" src="./viewer.js"></script>
	</script>
</body>

</html>
