<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Projets Web — Portfolio d'entraînement</title>
	<script src="data.js"></script>
	<style>
		:root {
			--bg: #0A0A0A;
			--fg: #EDEDED;
			--border: #232323;
			--accent: #3B82F6;
			--accent-hover: #2563EB;
			--card: #141414;
			--card-hover: #1A1A1A;
			--text-secondary: #888;
			--radius: 8px;
			--shadow: 0 0 0 1px var(--border)
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			scrollbar-width: thin;
			scrollbar-color: #555 transparent
		}
		*::-webkit-scrollbar{width:8px;height:8px}
		*::-webkit-scrollbar-track{background:transparent}
		*::-webkit-scrollbar-thumb{background:#555;border-radius:4px}
		*::-webkit-scrollbar-thumb:hover{background:#777}
		*::-webkit-scrollbar-corner{background:transparent}

		body {
			font-family: system-ui, -apple-system, sans-serif;
			background: var(--bg);
			color: var(--fg);
			min-height: 100vh;
			display: flex;
			flex-direction: column
		}

		.header {
			position: sticky;
			top: 0;
			z-index: 100;
			background: var(--bg);
			border-bottom: 1px solid var(--border);
			padding: 12px 24px;
			display: flex;
			align-items: center;
			gap: 16px
		}

		.header h1 {
			font-size: 18px;
			font-weight: 600
		}

		.header .nav {
			display: flex;
			gap: 4px;
			flex-wrap: wrap
		}

		.header .nav a {
			padding: 6px 14px;
			border-radius: var(--radius);
			font-size: 13px;
			color: var(--text-secondary);
			text-decoration: none;
			cursor: pointer;
			transition: all .15s
		}

		.header .nav a:hover,
		.header .nav a.active {
			color: var(--fg);
			background: var(--card)
		}

		.header .utils {
			display: flex;
			gap: 8px;
			align-items: center;
			margin-left: auto
		}

		.viewport-btns {
			display: flex;
			gap: 4px
		}

		.viewport-btn {
			padding: 6px 10px;
			border-radius: var(--radius);
			font-size: 11px;
			font-family: monospace;
			border: 1px solid var(--border);
			background: transparent;
			color: var(--text-secondary);
			cursor: pointer;
			transition: all .15s
		}

		.viewport-btn:hover,
		.viewport-btn.active {
			color: var(--fg);
			border-color: var(--accent);
			background: var(--card)
		}

		.main {
			display: flex;
			flex: 1;
			min-height: 0
		}

		.sidebar {
			width: 260px;
			border-right: 1px solid var(--border);
			padding: 16px;
			overflow-y: auto;
			flex-shrink: 0
		}

		.sidebar h2 {
			font-size: 11px;
			text-transform: uppercase;
			color: var(--text-secondary);
			letter-spacing: 1px;
			margin-bottom: 12px
		}

		.project-group {
			margin-bottom: 24px
		}

		.project-group .project-title {
			font-size: 14px;
			font-weight: 600;
			margin-bottom: 8px;
			display: flex;
			align-items: center;
			gap: 8px;
			cursor: pointer;
			padding: 6px 8px;
			border-radius: var(--radius);
			transition: all .15s
		}

		.project-group .project-title:hover {
			background: var(--card)
		}

		.project-group .project-title .icon {
			font-size: 16px
		}

		.theme-list {
			list-style: none;
			margin-left: 4px
		}

		.theme-list li {
			padding: 6px 8px 6px 28px;
			font-size: 13px;
			border-radius: var(--radius);
			cursor: pointer;
			color: var(--text-secondary);
			transition: all .15s;
			position: relative
		}

		.theme-list li:hover {
			color: var(--fg);
			background: var(--card)
		}

		.theme-list li.active {
			color: var(--accent);
			background: var(--card)
		}

		.theme-list li.active::before {
			content: '';
			position: absolute;
			left: 8px;
			top: 50%;
			transform: translateY(-50%);
			width: 3px;
			height: 16px;
			background: var(--accent);
			border-radius: 2px
		}

		.preview {
			flex: 1;
			display: flex;
			flex-direction: column;
			padding: 12px;
			background: #000;
			min-width: 0
		}

		.preview .info-bar {
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 8px 12px;
			margin-bottom: 8px;
			background: var(--card);
			border-radius: var(--radius);
			font-size: 13px;
			color: var(--text-secondary)
		}

		.preview .info-bar strong {
			color: var(--fg)
		}

		.preview .info-bar a {
			color: var(--accent);
			text-decoration: none
		}

		.preview .info-bar a:hover {
			text-decoration: underline
		}

		.preview iframe {
			flex: 1;
			width: 100%;
			border: 1px solid var(--border);
			border-radius: var(--radius);
			background: #fff;
			transition: width .3s
		}

		.preview-frame-wrap {
			flex: 1;
			display: flex;
			justify-content: center;
			position: relative;
			min-height: 0
		}

		.preview-frame-wrap iframe {
			flex: 1;
			max-width: 100%
		}

		.preview-overlay {
			position: absolute;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: var(--bg);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			z-index: 10;
			opacity: 0;
			pointer-events: none;
			transition: opacity .2s
		}

		.preview-overlay.active {
			opacity: 1;
			pointer-events: auto
		}

		.preview-spinner {
			width: 32px;
			height: 32px;
			border: 3px solid var(--border);
			border-top-color: var(--accent);
			border-radius: 50%;
			animation: spin .7s linear infinite
		}

		@keyframes spin {
			to { transform: rotate(360deg) }
		}

		.preview-error {
			text-align: center;
			padding: 24px
		}

		.preview-error p {
			color: #e06c75;
			margin-bottom: 12px;
			font-size: 14px
		}

		.preview-retry {
			padding: 8px 20px;
			border-radius: var(--radius);
			border: 1px solid var(--accent);
			background: transparent;
			color: var(--accent);
			font-size: 13px;
			cursor: pointer;
			transition: all .15s
		}

		.preview-retry:hover {
			background: var(--accent);
			color: #fff
		}

		.status-dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			display: inline-block;
			margin-right: 6px
		}

		.status-dot.green {
			background: #22C55E
		}

		.status-dot.yellow {
			background: #EAB308
		}

		.code-panel {
			display: none;
			flex: 1;
			flex-direction: column;
			background: var(--card);
			border-radius: var(--radius);
			overflow: hidden
		}

		.code-panel.active {
			display: flex
		}

		.code-toolbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 8px 16px;
			background: var(--bg);
			border-bottom: 1px solid var(--border);
			color: var(--text-secondary);
			font-size: 13px
		}

		.code-content {
			flex: 1;
			overflow: auto;
			padding: 16px;
			font-size: 13px;
			line-height: 1.6
		}

		.code-content pre {
			margin: 0;
			tab-size: 2;
			white-space: pre;
			word-break: normal;
			background: transparent !important
		}

		.code-content code {
			font-family: 'Fira Code', 'Courier New', monospace;
			white-space: pre;
			counter-reset: line
		}

		.code-content .line::before {
			counter-increment: line;
			content: counter(line);
			display: inline-block;
			width: 4ch;
			text-align: right;
			padding-right: 1.5em;
			color: var(--text-secondary);
			user-select: none
		}

		.markdown-body {
			color: #eee;
			line-height: 1.8;
			max-width: 720px;
			margin: 0 auto;
			padding: 32px 24px 64px
		}
		.markdown-body h1,
		.markdown-body h2,
		.markdown-body h3,
		.markdown-body h4 {
			color: #9d7cd8;
			margin: 1.5em 0 .5em;
			font-weight: 600
		}
		.markdown-body h1 {
			font-size: 1.8em;
			border-bottom: 1px solid #404040;
			padding-bottom: .3em
		}
		.markdown-body h2 {
			font-size: 1.4em;
			border-bottom: 1px solid #404040;
			padding-bottom: .3em
		}
		.markdown-body h3 {
			font-size: 1.15em
		}
		.markdown-body p {
			margin: 0 0 1em
		}
		.markdown-body ul {
			padding-left: 2em;
			margin: 0 0 1em
		}
		.markdown-body ul li::marker {
			color: #fab283
		}
		.markdown-body ol {
			padding-left: 2em;
			margin: 0 0 1em;
			color: #56b6c2
		}
		.markdown-body li {
			margin: .25em 0;
			color: #eee
		}
		.markdown-body code {
			background: #1a1a1a;
			padding: 2px 6px;
			border-radius: 3px;
			font-size: .9em;
			color: #7fd88f
		}
		.markdown-body pre {
			background: #0a0a0a;
			padding: 16px;
			border-radius: 6px;
			overflow-x: auto;
			margin: 0 0 1em;
			border: 1px solid #333
		}
		.markdown-body pre code {
			background: none;
			padding: 0;
			font-size: .85em;
			color: #eee
		}
		.markdown-body .shiki {
			background: #0a0a0a !important;
			padding: 16px;
			border-radius: 6px;
			overflow-x: auto;
			margin: 0 0 1em;
			border: 1px solid #333;
			line-height: 1.5
		}
		.markdown-body .shiki code {
			background: none;
			padding: 0;
			color: inherit
		}
		.markdown-body a {
			color: #fab283
		}
		.markdown-body a:hover {
			text-decoration: underline
		}
		.markdown-body blockquote {
			border-left: 3px solid #56b6c2;
			padding-left: 1em;
			color: #e5c07b;
			margin: 0 0 1em
		}
		.markdown-body table {
			border-collapse: collapse;
			margin: 0 0 1em;
			width: 100%
		}
		.markdown-body th,
		.markdown-body td {
			border: 1px solid #404040;
			padding: 8px 12px;
			text-align: left;
			color: #eee
		}
		.markdown-body th {
			background: #1a1a1a;
			font-weight: 600;
			color: #f5a742
		}
		.markdown-body hr {
			border: none;
			border-top: 1px solid #808080;
			margin: 1.5em 0
		}
		.markdown-body img {
			max-width: 100%;
			border-radius: 6px
		}
		.markdown-body strong {
			color: #f5a742
		}
		.markdown-body em {
			color: #e5c07b
		}
		.markdown-body .mermaid {
			background: #0a0a0a;
			border-radius: 6px;
			padding: 16px;
			margin: 0 0 1em;
			overflow-x: auto;
			border: 1px solid #333
		}
		.markdown-body .mermaid svg {
			max-width: 100%;
			display: block;
			margin: 0 auto
		}

		#apiContainer {
			font-family: system-ui, -apple-system, sans-serif
		}

		.view-btn {
			padding: 4px 10px;
			font-size: 11px;
			border: 1px solid var(--border);
			border-radius: 4px;
			background: transparent;
			color: var(--text-secondary);
			cursor: pointer;
			transition: all .15s;
			white-space: nowrap
		}

		.view-btn:hover,
		.view-btn.active {
			color: var(--fg);
			border-color: var(--accent);
			background: var(--card)
		}

		.nav-bar {
			display: flex;
			align-items: center;
			gap: 4px;
			padding: 6px 24px;
			border-bottom: 1px solid var(--border);
			background: var(--bg);
			flex-shrink: 0
		}

		.nav-bar .view-btn {
			padding: 4px 12px;
			font-size: 12px
		}

		@media(max-width:768px) {
			.sidebar {
				display: none
			}

			.header .nav {
				display: none
			}

			.header h1 {
				font-size: 14px
			}

			.nav-bar {
				overflow-x: auto;
				gap: 2px;
				padding: 6px 12px
			}

			.nav-bar .view-btn {
				font-size: 11px;
				padding: 4px 8px;
				flex-shrink: 0
			}
		}

		#codeContent>pre {
			overflow-x: auto;
		}

		.tester-bar {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 12px 0;
			border-bottom: 1px solid var(--border);
			margin-bottom: 16px;
			flex-wrap: wrap
		}
		.tester-bar label {
			font-size: 13px;
			color: var(--text-secondary);
			white-space: nowrap
		}
		.tester-input {
			flex: 1;
			min-width: 200px;
			padding: 7px 12px;
			font-size: 13px;
			font-family: monospace;
			background: var(--bg);
			border: 1px solid var(--border);
			border-radius: 4px;
			color: var(--fg);
			outline: none
		}
		.tester-input:focus {
			border-color: var(--accent)
		}
		.tester-progress-bar {
			height: 4px;
			background: var(--border);
			border-radius: 2px;
			overflow: hidden;
			position: relative
		}
		.tester-progress-fill {
			height: 100%;
			width: 40%;
			background: linear-gradient(90deg, var(--accent), var(--accent-hover));
			border-radius: 2px;
			position: absolute;
			animation: tester-indeterminate 1.5s ease-in-out infinite
		}
		@keyframes tester-indeterminate {
			0% { left: -40% }
			100% { left: 100% }
		}
		.tester-category {
			margin-bottom: 8px;
			border: 1px solid var(--border);
			border-radius: 6px;
			overflow: hidden
		}
		.tester-category-header {
			padding: 10px 14px;
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 14px;
			font-weight: 600;
			user-select: none;
			background: var(--card)
		}
		.tester-category-header:hover {
			background: var(--card-hover)
		}
		.tester-category-header.pass {
			color: #22C55E
		}
		.tester-category-header.fail {
			color: #EF4444
		}
		.tester-category-count {
			margin-left: auto;
			font-size: 12px;
			font-weight: 400
		}
		.tester-test-list {
			border-top: 1px solid var(--border)
		}
		.tester-test {
			padding: 8px 14px 8px 36px;
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 13px;
			flex-wrap: wrap
		}
		.tester-test.fail {
			background: rgba(239,68,68,.05)
		}
		.tester-test.error {
			background: rgba(234,179,8,.05)
		}
		.tester-test-name {
			flex: 1
		}
		.tester-test-duration {
			color: var(--text-secondary);
			font-size: 11px;
			font-family: monospace
		}
		.tester-test-error {
			width: 100%;
			margin-top: 4px;
			padding: 6px 10px;
			background: rgba(239,68,68,.1);
			border-radius: 4px;
			color: #e06c75;
			font-size: 12px;
			font-family: monospace;
			white-space: pre-wrap;
			word-break: break-all
		}
		.tester-summary {
			margin-top: 16px;
			padding: 14px;
			border-radius: 6px;
			font-size: 14px;
			line-height: 1.6
		}
		.tester-summary.pass {
			background: rgba(34,197,94,.08);
			color: #22C55E
		}
		.tester-summary.fail {
			background: rgba(239,68,68,.08);
			color: #EF4444
		}
		.tester-status-icon {
			font-size: 14px;
			line-height: 1
		}

		.sidebar-btn {
			padding: 4px 10px;
			font-size: 11px;
			border: 1px solid var(--border);
			border-radius: 4px;
			color: var(--text-secondary);
			background: transparent;
			cursor: pointer;
			transition: all .15s;
			white-space: nowrap
		}

		.sidebar-btn:hover {
			color: var(--fg);
			border-color: var(--accent);
			background: var(--card)
		}

		.learning-path {
			display: flex;
			flex-direction: column;
			height: 100%;
			overflow: hidden
		}

		.lp-main {
			display: flex;
			flex: 1;
			min-height: 0;
			overflow: hidden
		}

		.lp-nav-sidebar {
			width: 200px;
			flex-shrink: 0;
			border-right: 1px solid var(--border);
			padding: 16px 10px;
			overflow-y: auto;
			background: var(--bg);
			display: flex;
			flex-direction: column;
			gap: 4px
		}

		.lp-nav-title {
			font-size: 11px;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: .08em;
			color: var(--text-secondary);
			padding: 0 8px 8px
		}

		.lp-nav-btn {
			padding: 7px 10px;
			font-size: 12px;
			border: 1px solid transparent;
			border-radius: 6px;
			background: transparent;
			color: var(--text-secondary);
			cursor: pointer;
			text-align: left;
			transition: all .15s;
			line-height: 1.3
		}

		.lp-nav-btn.active {
			background: var(--accent);
			color: #fff;
			border-color: var(--accent);
			font-weight: 600
		}

		.lp-nav-btn:hover:not(.active) {
			background: var(--card);
			border-color: var(--border);
			color: var(--fg)
		}

		.lp-center {
			flex: 1;
			overflow-y: auto;
			padding: 24px 32px;
			min-width: 0
		}

		.lp-lesson-header {
			display: flex;
			align-items: center;
			gap: 12px;
			margin-bottom: 8px
		}

		.lp-lesson-title {
			font-size: 20px;
			font-weight: 600;
			margin: 0;
			color: var(--fg)
		}

		.lp-duration {
			font-size: 12px;
			padding: 2px 8px;
			border-radius: 4px;
			background: var(--card);
			color: var(--text-secondary);
			border: 1px solid var(--border);
			flex-shrink: 0
		}

		.lp-summary {
			font-size: 14px;
			color: var(--text-secondary);
			margin: 0 0 16px;
			line-height: 1.5
		}

		.lp-objective {
			padding: 12px 16px;
			border-radius: 8px;
			background: var(--card);
			border: 1px solid var(--border);
			margin-bottom: 20px
		}

		.lp-objective h3 {
			font-size: 13px;
			font-weight: 600;
			margin: 0 0 4px;
			color: var(--fg)
		}

		.lp-objective p {
			font-size: 13px;
			color: var(--text-secondary);
			margin: 0;
			line-height: 1.4
		}

		.lp-content {
			font-size: 14px;
			line-height: 1.6;
			color: var(--fg)
		}

		.lp-content pre {
			border-radius: 8px;
			overflow-x: auto
		}

		.lp-content code {
			font-size: 13px
		}

		.lp-content img {
			max-width: 100%;
			border-radius: 6px;
			margin: 12px 0
		}

		.lp-quiz-section {
			margin-top: 28px;
			padding-top: 20px;
			border-top: 1px solid var(--border)
		}

		.lp-quiz {
			border: 1px solid var(--border);
			border-radius: 8px;
			padding: 16px;
			margin-bottom: 12px;
			background: var(--card)
		}

		.lp-quiz-legend {
			font-size: 14px;
			font-weight: 600;
			color: var(--fg);
			margin-bottom: 10px;
			padding: 0
		}

		.lp-quiz-choice {
			display: block;
			width: 100%;
			text-align: left;
			padding: 8px 12px;
			margin-bottom: 4px;
			border: 1px solid var(--border);
			border-radius: 6px;
			background: var(--bg);
			color: var(--fg);
			font-size: 13px;
			cursor: pointer;
			transition: all .15s
		}

		.lp-quiz-choice:hover:not(:disabled) {
			border-color: var(--accent);
			background: var(--card-hover)
		}

		.lp-quiz-choice:disabled {
			opacity: .7;
			cursor: default
		}

		.lp-quiz-choice.correct {
			border-color: #5cb85c;
			background: rgba(92,184,92,.1)
		}

		.lp-quiz-choice.incorrect {
			border-color: #e06c75;
			background: rgba(224,108,117,.1)
		}

		.lp-quiz-reveal {
			margin-top: 10px;
			padding: 10px 12px;
			border-radius: 6px;
			background: var(--bg);
			border: 1px solid var(--border);
			font-size: 13px;
			color: var(--text-secondary);
			line-height: 1.4;
			white-space: pre-wrap
		}

		.lp-check-section {
			margin-top: 32px;
			padding: 16px;
			border-radius: 8px;
			border: 1px solid var(--border);
			background: var(--card)
		}

		.lp-url-label {
			display: block;
			font-size: 12px;
			font-weight: 600;
			color: var(--text-secondary);
			margin-bottom: 4px
		}

		.lp-url-input {
			width: 100%;
			box-sizing: border-box;
			margin-bottom: 10px;
			font-size: 13px
		}

		.lp-check-btn {
			padding: 8px 20px;
			font-size: 13px
		}

		.lp-check-result {
			margin-top: 12px;
			padding: 12px;
			border-radius: 6px;
			background: var(--bg);
			border: 1px solid var(--border)
		}

		.lp-check-plan-title {
			font-weight: 700;
			color: var(--fg) !important;
			font-size: 14px !important;
			margin-bottom: 6px !important
		}

		.lp-check-plan-desc {
			font-size: 13px !important;
			color: var(--text-secondary) !important;
			margin-bottom: 4px !important
		}

		.lp-check-plan-routes {
			margin: 6px 0 0;
			padding-left: 20px;
			font-size: 12px;
			color: var(--text-secondary);
			list-style: disc
		}

		.lp-check-plan-routes li {
			margin-bottom: 2px
		}

		.lp-check-category {
			margin-bottom: 8px;
			border: 1px solid var(--border);
			border-radius: 6px;
			padding: 8px 10px;
			background: var(--card)
		}

		.lp-check-category-summary {
			cursor: pointer;
			font-size: 13px;
			font-weight: 600;
			color: var(--fg);
			display: flex;
			align-items: center;
			gap: 6px;
			list-style: none
		}

		.lp-check-category-summary::-webkit-details-marker {
			display: none
		}

		.lp-check-category-summary::before {
			content: '▶';
			font-size: 10px;
			color: var(--text-secondary);
			transition: transform .15s
		}

		.lp-check-category[open] > .lp-check-category-summary::before {
			content: '▼'
		}

		.lp-check-category-count {
			margin-left: auto;
			font-weight: 400;
			color: var(--text-secondary);
			font-size: 12px
		}

		.lp-check-test-list {
			list-style: none;
			margin: 8px 0 0;
			padding: 0
		}

		.lp-check-test-item {
			font-size: 12px;
			padding: 3px 0 3px 20px;
			display: flex;
			align-items: center;
			gap: 4px;
			flex-wrap: wrap
		}

		.lp-check-test-pass {
			color: var(--fg)
		}

		.lp-check-test-fail {
			color: #e06c75
		}

		.lp-check-test-duration {
			color: var(--text-secondary);
			font-size: 11px;
			margin-left: auto
		}

		.lp-check-test-error {
			font-size: 11px;
			color: #e06c75;
			padding: 4px 8px;
			margin-top: 2px;
			background: #2d1b1e;
			border-radius: 4px;
			width: 100%;
			word-break: break-word
		}

		.lp-check-summary {
			margin: 8px 0 0 !important;
			font-weight: 600;
			font-size: 13px !important
		}

		.lp-check-pass {
			color: #5cb85c
		}

		.lp-check-fail {
			color: #e06c75
		}

		.lp-check-hint {
			font-style: italic;
			font-weight: 400;
			font-size: 12px;
			display: block;
			margin-top: 2px
		}

		.lp-sidebar {
			width: 260px;
			flex-shrink: 0;
			border-left: 1px solid var(--border);
			padding: 20px;
			overflow-y: auto;
			background: var(--bg)
		}

		.lp-sidebar-title {
			font-size: 13px;
			font-weight: 600;
			margin: 0 0 8px;
			color: var(--fg)
		}

		.lp-file-list {
			list-style: none;
			padding: 0;
			margin: 0 0 16px
		}

		.lp-file-item {
			font-size: 12px;
			font-family: monospace;
			padding: 4px 8px;
			border-radius: 4px;
			color: var(--text-secondary);
			background: var(--card);
			margin-bottom: 4px;
			word-break: break-all
		}

		.lp-checkpoint-section {
			border-top: 1px solid var(--border);
			padding-top: 16px
		}

		.lp-checkpoint-section h3 {
			font-size: 13px;
			font-weight: 600;
			margin: 0 0 8px;
			color: var(--fg)
		}

		.lp-checkpoint-details {
			font-size: 13px;
			color: var(--text-secondary)
		}

		.lp-checkpoint-details summary {
			cursor: pointer;
			font-weight: 500;
			margin-bottom: 8px
		}

		.lp-checkpoint-details p {
			margin: 0 0 6px;
			font-size: 12px
		}

		.lp-checkpoint-link {
			font-size: 12px;
			color: var(--accent);
			text-decoration: none
		}

		.lp-checkpoint-link:hover {
			text-decoration: underline
		}

		.lp-file-toolbar {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 8px 0 12px;
			border-bottom: 1px solid var(--border);
			margin-bottom: 16px;
			flex-wrap: wrap
		}

		.lp-file-toolbar-name {
			font-size: 13px;
			font-weight: 600;
			color: var(--fg);
			margin-right: auto
		}

		.lp-file-viewer {
			overflow-x: auto;
			font-size: 13px;
			line-height: 1.5
		}

		.lp-file-viewer pre {
			border-radius: 8px;
			padding: 16px
		}

		.lp-file-viewer code {
			font-size: 13px
		}

		@media(max-width: 768px) {
			.lp-main {
				flex-direction: column
			}

			.lp-nav-sidebar {
				width: 100%;
				flex-direction: row;
				flex-wrap: wrap;
				border-right: none;
				border-bottom: 1px solid var(--border);
				padding: 8px 10px;
				gap: 2px;
				overflow-x: auto
			}

			.lp-nav-title {
				display: none
			}

			.lp-nav-btn {
				font-size: 11px;
				padding: 4px 10px;
				white-space: nowrap
			}

			.lp-center {
				padding: 16px
			}

			.lp-sidebar {
				width: 100%;
				border-left: none;
				border-top: 1px solid var(--border);
				padding: 16px
			}
		}

		@media(prefers-reduced-motion: reduce) {
			*, *::before, *::after {
				transition-duration: 0s !important;
				animation-duration: 0s !important
			}

			.preview-spinner {
				animation-duration: 1.4s !important
			}
		}
	</style>
</head>

<body>
	<div class="header">
		<h1>🏗️ Projets d'entraînement</h1>
		<div class="nav" id="projectNav"></div>
		<div class="utils">
			<div class="viewport-btns">
				<button class="viewport-btn" data-width="100%" onclick="setViewport('100%')">XL</button>
				<button class="viewport-btn" data-width="1024px" onclick="setViewport('1024px')">LG</button>
				<button class="viewport-btn" data-width="768px" onclick="setViewport('768px')">MD</button>
				<button class="viewport-btn" data-width="480px" onclick="setViewport('480px')">SM</button>
				<button class="viewport-btn" data-width="375px" onclick="setViewport('375px')">XS</button>
			</div>
		</div>
	</div>
	<div class="nav-bar">
		<button class="view-btn active" data-view="preview"
			onclick="window.switchView('preview')">Aperçu</button>
		<button class="view-btn" data-view="source" onclick="window.switchView('source')">Source</button>
		<button class="view-btn" data-view="prd" onclick="window.switchView('prd')">PRD</button>
		<button class="view-btn" data-view="openapi" onclick="window.switchView('openapi')">OpenAPI</button>
		<button class="view-btn" data-view="apiclient" onclick="window.switchView('apiclient')">API</button>
		<button class="view-btn" data-view="guide" onclick="window.switchView('guide')">Guide</button>
		<button class="view-btn" data-view="tester" onclick="window.switchView('tester')">Testeur</button>
	</div>
	<div class="main">
		<div class="sidebar" id="sidebar"></div>
		<div class="preview" id="preview">
			<div class="info-bar" id="infoBar">
				<span id="statusInfo">Sélectionnez un projet et un thème pour commencer</span>
			</div>
			<div class="preview-frame-wrap">
				<div class="preview-overlay" id="previewOverlay">
					<div class="preview-spinner" id="previewSpinner"></div>
					<div class="preview-error" id="previewError" style="display:none">
						<p id="previewErrorMsg">Impossible de charger l'aperçu</p>
						<button class="preview-retry" onclick="window._retryPreview()">Réessayer</button>
					</div>
				</div>
				<iframe id="previewFrame"></iframe>
			</div>
			<div class="code-panel" id="codePanel">
				<div class="code-toolbar">
					<span id="codeFileName"></span>
					<div style="display:flex;gap:4px;align-items:center">
						<span id="apiOptions" style="display:none;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary)">
							API: <input id="apiUrlInput" style="width:180px;padding:3px 8px;font-size:12px;background:var(--card);border:1px solid var(--border);border-radius:4px;color:var(--fg);outline:none" aria-label="URL de l'API" />
							Token: <input id="apiTokenInput" style="width:160px;padding:3px 8px;font-size:12px;background:var(--card);border:1px solid var(--border);border-radius:4px;color:var(--fg);outline:none" placeholder="token-1" aria-label="Token d'authentification" />
							<button class="view-btn" id="apiResetData" onclick="window.resetApiData()">↺ Reset</button>
						</span>
						<button class="view-btn" id="prdToggle" style="display:none" onclick="window.togglePrdView()">Source</button>
						<button class="view-btn" id="apiToggle" style="display:none" onclick="window.toggleApiView()">Source</button>
						<button class="view-btn" id="guideToggle" style="display:none" onclick="window.toggleGuideView()">Source</button>
						<button class="view-btn" onclick="window.switchView('preview')">✕ Retour</button>
					</div>
				</div>
				<div class="code-content" id="codeContent">
					<div style="color:#888;padding:20px">Charge…</div>
				</div>
				<div id="apiContainer" style="display:none;flex:1;overflow:hidden"></div>
			</div>
		</div>
	</div>

	<script>
		var currentProject = null;
		var currentTheme = null;

		function init() {
			renderNav();
			// Auto-select first project
			if (projectsData.length > 0) selectProject(projectsData[0].id);
		}

		function renderNav() {
			const nav = document.getElementById('projectNav');
			nav.innerHTML = projectsData.map(p =>
				`<a href="#" class="${p.id === currentProject?.id ? 'active' : ''}" onclick="selectProject('${p.id}')">${p.icon} ${p.name}</a>`
			).join('');
		}

		function selectProject(projectId) {
			currentProject = projectsData.find(p => p.id === projectId);
			currentTheme = null;
			if (window.resetGuideIndex) window.resetGuideIndex();
			renderNav();
			renderSidebar();
			// Auto-select first theme
			if (currentProject && currentProject.themes.length > 0) {
				selectTheme(currentProject.themes[0].id);
			}
		}

		function renderSidebar() {
			const sidebar = document.getElementById('sidebar');
			if (!currentProject) { sidebar.innerHTML = ''; return; }
			sidebar.innerHTML = `
    <h2>${currentProject.icon} ${currentProject.name}</h2>
    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px">${currentProject.description}</p>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px">
      <button class="sidebar-btn" onclick="window.switchView('prd')">📄 PRD</button>
      <button class="sidebar-btn" onclick="window.switchView('openapi')">🔌 OpenAPI</button>
      <button class="sidebar-btn" onclick="window.switchView('apiclient')">⚙️ API Client</button>
    </div>
    <h2 style="margin-top:8px">Thèmes</h2>
    <ul class="theme-list">
      ${currentProject.themes.map(t =>
				`<li class="${t.id === currentTheme?.id ? 'active' : ''}" onclick="selectTheme('${t.id}')">
          ${t.palette ? t.palette.map(function(c) { return '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + c + ';margin-right:2px;border:1px solid var(--border);vertical-align:middle"></span>'; }).join('') : '<span class="status-dot green"></span>'}${t.name}
          <br><small style="color:var(--text-secondary);font-size:11px">${t.desc}</small>
        </li>`
			).join('')}
    </ul>
  `;
		}

		function selectTheme(themeId) {
			currentTheme = currentProject.themes.find(t => t.id === themeId);
			renderSidebar();
			if (typeof window.switchView === 'function') window.switchView('preview');
			if (currentTheme) {
				showPreviewLoading();
				const iframe = document.getElementById('previewFrame');
				iframe.src = currentTheme.file;
				document.getElementById('statusInfo').innerHTML =
					`<strong>${currentProject.name}</strong> — ${currentTheme.name} <span style="color:var(--text-secondary)">| ${currentTheme.desc}</span>`;
			}
		}

		function showPreviewLoading() {
			const overlay = document.getElementById('previewOverlay');
			const spinner = document.getElementById('previewSpinner');
			const error = document.getElementById('previewError');
			error.style.display = 'none';
			spinner.style.display = 'block';
			overlay.classList.add('active');
		}

		function hidePreviewLoading() {
			const overlay = document.getElementById('previewOverlay');
			overlay.classList.remove('active');
		}

		function showPreviewError(msg) {
			const overlay = document.getElementById('previewOverlay');
			const spinner = document.getElementById('previewSpinner');
			const error = document.getElementById('previewError');
			const msgEl = document.getElementById('previewErrorMsg');
			spinner.style.display = 'none';
			error.style.display = 'block';
			msgEl.textContent = msg || "Impossible de charger l'aperçu";
			overlay.classList.add('active');
		}

		window._retryPreview = function () {
			if (currentTheme) selectTheme(currentTheme.id);
		};

		function setViewport(width) {
			const iframe = document.getElementById('previewFrame');
			if (width === '100%') {
				iframe.style.width = '';
				iframe.style.flex = '';
			} else {
				iframe.style.width = width;
				iframe.style.flex = '0 0 auto';
			}
			document.querySelectorAll('.viewport-btn').forEach(b => {
				b.classList.toggle('active', b.dataset.width === width);
			});
		}

		document.addEventListener('DOMContentLoaded', function () {
			const iframe = document.getElementById('previewFrame');
			iframe.addEventListener('load', hidePreviewLoading);
			iframe.addEventListener('error', function () {
				showPreviewError('Erreur réseau lors du chargement de l\'aperçu');
			});
			init();
		});

		document.addEventListener('keydown', function (e) {
			if (e.ctrlKey && e.key >= '1' && e.key <= '7') {
				var views = ['preview', 'source', 'prd', 'openapi', 'apiclient', 'guide', 'tester'];
				var idx = parseInt(e.key) - 1;
				if (idx < views.length && typeof window.switchView === 'function') {
					e.preventDefault();
					window.switchView(views[idx]);
				}
			}
			if (e.key === 'Escape') {
				var panel = document.getElementById('codePanel');
				if (panel && panel.classList.contains('active') && typeof window.switchView === 'function') {
					e.preventDefault();
					window.switchView('preview');
				}
			}
		});
	</script>
	<script type="module" src="./viewer.js"></script>
</body>

</html>
