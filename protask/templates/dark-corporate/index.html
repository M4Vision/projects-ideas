<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProTask</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: #1E1E2E;
  color: #E2E8F0;
  font-size: 13px;
  line-height: 1.4;
  height: 100vh;
  overflow-x: hidden;
}
a { color: #3B82F6; text-decoration: none; }
a:hover { text-decoration: underline; }
input, select, textarea {
  font-family: inherit;
  font-size: 13px;
  background: #1E1E2E;
  border: 1px solid #3A3B4E;
  color: #E2E8F0;
  border-radius: 6px;
  padding: 8px 12px;
  outline: none;
  transition: border-color 0.15s;
  width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: #2563EB; }
button {
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  border: none;
  border-radius: 6px;
  padding: 8px 16px;
  transition: opacity 0.15s;
  background: #2563EB;
  color: #fff;
  font-weight: 500;
}
button:hover { opacity: 0.9; }
button.secondary { background: #3A3B4E; color: #E2E8F0; }
button.ghost { background: transparent; color: #94A3B8; padding: 6px 10px; }
button.ghost:hover { background: #2A2B3D; }
button.danger { background: #DC2626; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }

nav {
  display: flex;
  align-items: center;
  background: #1A1B2F;
  border-bottom: 1px solid #3A3B4E;
  padding: 0 24px;
  height: 48px;
  gap: 4px;
  position: sticky;
  top: 0;
  z-index: 100;
}
nav .logo {
  font-weight: 700;
  font-size: 15px;
  color: #E2E8F0;
  margin-right: 32px;
  letter-spacing: -0.3px;
}
nav .tab {
  padding: 12px 18px;
  color: #94A3B8;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  font-weight: 500;
  font-size: 13px;
  user-select: none;
}
nav .tab:hover { color: #E2E8F0; }
nav .tab.active {
  color: #E2E8F0;
  border-bottom-color: #2563EB;
  background: rgba(37, 99, 235, 0.08);
}
nav .tab.user-tab { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.page { display: none; padding: 24px; }
.page.active { display: block; }

.page-login.active {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - 48px);
}
.page-login .card {
  background: #2A2B3D;
  border: 1px solid #3A3B4E;
  border-radius: 10px;
  padding: 40px 32px;
  width: 380px;
}
.page-login .card h1 {
  font-size: 24px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 4px;
  letter-spacing: -0.5px;
}
.page-login .card .sub {
  color: #94A3B8;
  text-align: center;
  margin-bottom: 28px;
  font-size: 14px;
}
.page-login .card .field { margin-bottom: 14px; }
.page-login .card .field label { display: block; margin-bottom: 4px; color: #94A3B8; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
.page-login .card button { width: 100%; padding: 10px; margin-top: 6px; font-size: 14px; }
.page-login .card .links { display: flex; justify-content: space-between; margin-top: 16px; font-size: 12px; }
.page-login .card .toggle-form { color: #3B82F6; cursor: pointer; font-size: 12px; }
.page-login .card .toggle-form:hover { text-decoration: underline; }
.page-login .card .error { color: #EF4444; font-size: 12px; margin-top: 8px; text-align: center; display: none; }
#register-form { display: none; }

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  gap: 12px;
  flex-wrap: wrap;
}
.page-header h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
.page-header .right { display: flex; align-items: center; gap: 10px; }

.board-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}
.board-card {
  background: #2A2B3D;
  border: 1px solid #3A3B4E;
  border-radius: 8px;
  padding: 16px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.board-card:hover { border-color: #2563EB; }
.board-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.board-card .meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: #94A3B8; margin-bottom: 10px; }
.board-card .meta .count { font-family: 'JetBrains Mono', monospace; color: #E2E8F0; }
.board-card .bar-wrap { background: #3A3B4E; border-radius: 2px; height: 3px; margin-bottom: 8px; }
.board-card .bar-wrap .bar { height: 100%; background: #2563EB; border-radius: 2px; transition: width 0.3s; }
.board-card .bar-wrap .bar.warning { background: #F59E0B; }
.board-card .bar-wrap .bar.good { background: #10B981; }
.board-card .footer { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #94A3B8; }
.board-card .footer .due-soon { color: #F59E0B; font-weight: 600; }
.board-card .footer .overdue { color: #EF4444; font-weight: 600; }

.avatar-stack { display: flex; }
.avatar-stack .av {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid #2A2B3D;
  margin-left: -6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 600; color: #fff;
}
.avatar-stack .av:first-child { margin-left: 0; }
.avatar-stack .av.more { background: #3A3B4E; font-size: 9px; }

.board-top {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
}
.board-top h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 600; background: rgba(37, 99, 235, 0.15); color: #3B82F6;
}
.badge.green { background: rgba(16, 185, 129, 0.15); color: #10B981; }
.badge.orange { background: rgba(245, 158, 11, 0.15); color: #F59E0B; }
.badge.red { background: rgba(239, 68, 68, 0.15); color: #EF4444; }
.board-top .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.columns {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: start;
}
.column {
  background: #232435;
  border-radius: 8px;
  border: 1px solid #3A3B4E;
  padding: 12px;
}
.column-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px; padding-bottom: 8px;
  border-bottom: 1px solid #3A3B4E;
}
.column-header h4 { font-size: 13px; font-weight: 600; }
.column-header .count { font-family: 'JetBrains Mono', monospace; color: #94A3B8; font-size: 12px; background: #3A3B4E; padding: 1px 7px; border-radius: 4px; }
.task-card {
  background: #2A2B3D;
  border: 1px solid #3A3B4E;
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.task-card:hover { border-color: #2563EB; }
.task-card h5 { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.task-card .labels { display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; }
.task-card .labels .lbl { padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }
.task-card .task-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #94A3B8; }
.task-card .task-meta .due { font-family: 'JetBrains Mono', monospace; }
.task-card .task-meta .due.over { color: #EF4444; }

.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  z-index: 200; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #2A2B3D; border: 1px solid #3A3B4E; border-radius: 10px;
  width: 580px; max-height: 80vh; overflow-y: auto; padding: 24px;
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-header h3 { font-size: 16px; font-weight: 700; padding-right: 24px; }
.modal-header .close { background: none; border: none; color: #94A3B8; font-size: 20px; cursor: pointer; padding: 4px; }
.modal-section { margin-bottom: 16px; }
.modal-section h6 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #94A3B8; margin-bottom: 6px; }
.modal-section p { color: #CBD5E1; line-height: 1.5; white-space: pre-wrap; }
.modal-section .labels { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.modal-section .labels .lbl { padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
.modal-field { margin-bottom: 10px; }
.modal-field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #94A3B8; margin-bottom: 4px; }
.modal-row { display: flex; gap: 12px; }
.modal-row > * { flex: 1; }
.comment { padding: 8px 0; border-bottom: 1px solid #3A3B4E; font-size: 12px; }
.comment:last-child { border-bottom: none; }
.comment .author { font-weight: 600; color: #E2E8F0; }
.comment .time { color: #64748B; font-size: 11px; margin-left: 8px; }
.comment p { margin-top: 2px; color: #94A3B8; }
.comment-form { display: flex; gap: 8px; margin-top: 8px; }
.comment-form input { flex: 1; }
.comment-form button { padding: 8px 14px; }

.settings-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.settings-card {
  background: #2A2B3D; border: 1px solid #3A3B4E; border-radius: 8px; padding: 20px;
}
.settings-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
.settings-card .field { margin-bottom: 12px; }
.settings-card .field label { display: block; margin-bottom: 4px; color: #94A3B8; font-size: 12px; font-weight: 500; }
.col-list { list-style: none; }
.col-list li {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 0; border-bottom: 1px solid #3A3B4E;
}
.col-list li:last-child { border-bottom: none; }
.col-list .drag { color: #64748B; cursor: grab; font-size: 16px; }
.col-list .col-name { flex: 1; font-size: 13px; }
.labels-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.label-row { display: flex; align-items: center; gap: 8px; }
.label-row input[type="color"] { width: 28px; height: 28px; border: 1px solid #3A3B4E; border-radius: 4px; padding: 2px; background: transparent; cursor: pointer; }
.label-row input[type="text"] { flex: 1; }
.label-row button { padding: 4px 10px; font-size: 12px; }

.profile-layout { display: grid; grid-template-columns: 200px 1fr; gap: 24px; }
.profile-sidebar {
  background: #2A2B3D; border: 1px solid #3A3B4E; border-radius: 8px;
  padding: 24px; text-align: center;
}
.profile-sidebar .avatar {
  width: 72px; height: 72px; border-radius: 50%; background: #2563EB;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px; font-size: 28px; font-weight: 700; color: #fff;
}
.profile-sidebar h4 { font-size: 15px; font-weight: 600; }
.profile-sidebar p { color: #94A3B8; font-size: 12px; }
.profile-main {
  background: #2A2B3D; border: 1px solid #3A3B4E; border-radius: 8px;
  padding: 24px;
}
.profile-main .field { margin-bottom: 16px; }
.profile-main .field label { display: block; margin-bottom: 4px; color: #94A3B8; font-size: 12px; font-weight: 500; }
.profile-main .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.profile-main .actions { display: flex; gap: 8px; margin-top: 20px; }

.toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 300;
  background: #2A2B3D; border: 1px solid #3A3B4E; border-radius: 8px;
  padding: 12px 20px; font-size: 13px; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  display: none; max-width: 360px;
}
.toast.show { display: block; animation: slideIn 0.2s ease; }
.toast.success { border-color: #10B981; }
.toast.error { border-color: #EF4444; }
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.empty-state { text-align: center; padding: 40px 20px; color: #64748B; }
.empty-state p { font-size: 14px; margin-bottom: 12px; }
.empty-state button { font-size: 13px; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #3A3B4E; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #4A4B5E; }

@media (min-width: 1440px) {
  .page { max-width: 1400px; margin: 0 auto; }
}
@media (max-width: 1024px) {
  .settings-layout { grid-template-columns: 1fr; }
  .profile-layout { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .columns { grid-template-columns: repeat(2, 1fr); }
  .board-grid { grid-template-columns: repeat(2, 1fr); }
  nav { padding: 0 16px; }
  nav .tab { padding: 12px 14px; }
  .modal { width: 90vw; padding: 20px; }
  .profile-main .field-row { grid-template-columns: 1fr; }
  .board-top .right { margin-left: 0; width: 100%; justify-content: flex-start; flex-wrap: wrap; }
  .page { padding: 20px; }
  .page-login .card { width: 100%; max-width: 420px; }
}
@media (max-width: 480px) {
  body { font-size: 12px; }
  .columns { grid-template-columns: 1fr; }
  .board-grid { grid-template-columns: 1fr; }
  nav { flex-wrap: wrap; height: auto; padding: 6px 12px; gap: 2px; }
  nav .logo { width: 100%; margin-right: 0; margin-bottom: 2px; padding: 8px 0; font-size: 14px; }
  nav .tab { padding: 12px 10px; font-size: 12px; min-height: 44px; }
  .page { padding: 14px; }
  .page-header { flex-direction: column; align-items: flex-start; gap: 12px; }
  .page-header h2 { font-size: 16px; }
  .page-login .card { width: 100%; max-width: none; padding: 24px 18px; }
  .page-login .card h1 { font-size: 20px; }
  .modal { width: 100vw; max-height: 100vh; border-radius: 0; border-left: none; border-right: none; padding: 16px; }
  .modal-header h3 { font-size: 15px; }
  .board-top { flex-direction: column; align-items: flex-start; gap: 8px; }
  .board-top h2 { font-size: 16px; }
  .board-top .right { margin-left: 0; width: 100%; justify-content: flex-start; flex-wrap: wrap; }
  .settings-card { padding: 16px; }
  .profile-sidebar { padding: 16px; }
  .profile-main { padding: 16px; }
  .profile-main .field-row { grid-template-columns: 1fr; }
  .profile-main .actions { flex-direction: column; }
  .profile-main .actions button { width: 100%; min-height: 44px; }
  button { min-height: 44px; }
  button.ghost { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
  .board-card { padding: 14px; }
  .task-card { padding: 10px; }
  .column { padding: 10px; }
  .page-login .card button { min-height: 44px; }
  .board-card .bar-wrap { height: 4px; }
  .settings-layout { gap: 14px; }
  .profile-layout { gap: 14px; }
  .comment { font-size: 13px; }
  .badge { font-size: 10px; padding: 3px 7px; }
}
</style>
<script src="../../demo-api.js"></script>
</head>
<body>

<nav>
  <span class="logo">ProTask</span>
  <span class="tab tab-auth active" data-tab="dashboard">Tableaux</span>
  <span class="tab tab-auth" data-tab="board">Board</span>
  <span class="tab tab-auth" data-tab="settings">Paramètres</span>
  <span class="tab tab-auth user-tab" data-tab="profile" id="nav-user">Profil</span>
  <span class="tab tab-guest" data-tab="login">Connexion</span>
</nav>

<!-- LOGIN -->
<div class="page page-login active" id="page-login">
  <div class="card">
    <h1>ProTask</h1>
    <p class="sub">Connectez-vous à votre espace de travail</p>
    <div id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="vous@entreprise.com">
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="login-password" placeholder="············">
      </div>
      <button id="login-btn">Se connecter</button>
      <div class="error" id="login-error"></div>
      <div class="links">
        <span class="toggle-form" onclick="showRegister()">Créer un compte</span>
      </div>
    </div>
    <div id="register-form">
      <div class="field">
        <label>Nom complet</label>
        <input type="text" id="reg-name" placeholder="Marie Dupont">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="vous@entreprise.com">
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="reg-password" placeholder="············">
      </div>
      <button id="register-btn">Créer un compte</button>
      <div class="error" id="register-error"></div>
      <div class="links">
        <span class="toggle-form" onclick="showLogin()">Déjà un compte ?</span>
      </div>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="page" id="page-dashboard">
  <div class="page-header">
    <h2>Mes tableaux</h2>
    <button onclick="createBoard()">+ Nouveau tableau</button>
  </div>
  <div class="board-grid" id="board-grid"></div>
</div>

<!-- BOARD -->
<div class="page" id="page-board">
  <div class="board-top" id="board-top"></div>
  <div class="columns" id="columns-container"></div>
</div>

<!-- SETTINGS -->
<div class="page" id="page-settings">
  <div class="page-header">
    <h2>Paramètres du tableau</h2>
  </div>
  <div class="settings-layout" id="settings-layout"></div>
</div>

<!-- PROFILE -->
<div class="page" id="page-profile">
  <div class="page-header">
    <h2>Profil</h2>
  </div>
  <div class="profile-layout" id="profile-layout"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="task-modal">
  <div class="modal" id="modal-content"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ========== HELPERS ==========


let counters = { users: 5, boards: 4, columns: 10, cards: 30, labels: 10, comments: 15, invitations: 5 };

function nextId(type) { return counters[type]++; }

function getInitials(name) {
  return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
}

function getUserById(id) { return users.find(u => u.id === id); }
function getLabelById(id) { return labels.find(l => l.id === id); }

function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return "à l'instant";
  if (mins < 60) return `il y a ${mins} min`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `il y a ${hours}h`;
  const days = Math.floor(hours / 24);
  if (days < 30) return `il y a ${days}j`;
  return new Date(dateStr).toLocaleDateString('fr-FR');
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  return new Date(dateStr).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
}

function isOverdue(dateStr) {
  if (!dateStr) return false;
  return new Date(dateStr) < new Date(new Date().toDateString());
}

function isDueSoon(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  const soon = new Date();
  soon.setDate(soon.getDate() + 3);
  return d >= new Date(new Date().toDateString()) && d <= soon;
}

function isToday(dateStr) {
  if (!dateStr) return false;
  return new Date(dateStr).toDateString() === new Date().toDateString();
}

function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ========== MOCK DATA ==========
let users = [
  { id: 1, name: 'Marie Dupont', email: 'marie@exemple.fr', password: 'password123', avatar: null, createdAt: '2026-01-15T10:00:00Z' },
  { id: 2, name: 'Alex Chen', email: 'alex@exemple.fr', password: 'password123', avatar: null, createdAt: '2026-02-01T10:00:00Z' },
  { id: 3, name: 'Mike Roux', email: 'mike@exemple.fr', password: 'password123', avatar: null, createdAt: '2026-02-15T10:00:00Z' },
  { id: 4, name: 'Léa Kramer', email: 'lea@exemple.fr', password: 'password123', avatar: null, createdAt: '2026-03-01T10:00:00Z' },
];

let boards = [
  { id: 1, title: 'Marketing Q4', ownerId: 1, memberIds: [1, 2, 3, 4], createdAt: '2026-03-15T10:00:00Z' },
  { id: 2, title: 'Lancement Produit', ownerId: 1, memberIds: [1, 2, 3], createdAt: '2026-04-01T10:00:00Z' },
  { id: 3, title: 'Design System', ownerId: 2, memberIds: [1, 2, 4], createdAt: '2026-04-10T10:00:00Z' },
];

const api = demoApi;

// ========== NAVIGATION & AUTH ==========
function showPage(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const page = document.getElementById('page-' + name);
  if (page) page.classList.add('active');
}

function toggleAuthUI() {
  const auth = !!currentUser;
  document.querySelectorAll('.tab-auth').forEach(t => t.style.display = auth ? '' : 'none');
  document.querySelectorAll('.tab-guest').forEach(t => t.style.display = auth ? 'none' : '');
  if (auth) {
    const userTab = document.getElementById('nav-user');
    userTab.innerHTML = `<span class="av" style="width:24px;height:24px;border-radius:50%;background:#2563EB;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;border:none;margin:0">${getInitials(currentUser.name)}</span> ${currentUser.name.split(' ')[0]}`;
  }
}

function requireAuth() {
  if (!currentUser) {
    showPage('login');
    return false;
  }
  return true;
}

function navigateToBoard(boardId) {
  currentBoardId = boardId;
  if (requireAuth()) {
    renderBoard();
    showPage('board');
  }
}

async function createBoard() {
  const title = prompt('Nom du nouveau tableau :');
  if (!title || !title.trim()) return;
  try {
    await api.createBoard({ title: title.trim() });
    toast('Tableau créé avec succès');
    renderDashboard();
  } catch (e) {
    toast(e.message, 'error');
  }
}

// ========== RENDER FUNCTIONS ==========
async function renderDashboard() {
  if (!requireAuth()) return;
  try {
    const userBoards = await api.getBoards();
    const grid = document.getElementById('board-grid');

    if (userBoards.length === 0) {
      grid.innerHTML = `<div class="empty-state"><p>Aucun tableau pour le moment</p><button onclick="createBoard()">Créer un tableau</button></div>`;
      return;
    }

    grid.innerHTML = userBoards.map(b => {
      const boardCols = columns.filter(c => c.boardId === b.id);
      const boardCards = cards.filter(c => boardCols.some(col => col.id === c.columnId));
      const lastCol = boardCols.reduce((max, c) => c.order > max.order ? c : max, boardCols[0]);
      const doneCards = boardCards.filter(c => c.columnId === lastCol?.id);
      const total = boardCards.length;
      const done = doneCards.length;
      const progress = total ? Math.round(done / total * 100) : 0;
      const dueCards = boardCards.filter(c => c.dueDate).sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
      const nearestDue = dueCards[0];
      let dueClass = '', dueLabel = '';
      if (nearestDue) {
        if (isOverdue(nearestDue.dueDate)) { dueClass = 'overdue'; dueLabel = 'En retard'; }
        else if (isDueSoon(nearestDue.dueDate)) { dueClass = 'due-soon'; dueLabel = 'Dans < 3j'; }
        else { dueLabel = formatDate(nearestDue.dueDate); }
      }
      if (dueCards.filter(c => isOverdue(c.dueDate)).length > 0) { dueClass = 'overdue'; dueLabel = `${dueCards.filter(c => isOverdue(c.dueDate)).length} en retard`; }

      let barClass = 'bar';
      if (progress >= 80) barClass += ' good';
      else if (progress < 40) barClass += ' warning';

      const members = b.members || [];
      const avatars = members.slice(0, 4).map(m =>
        `<div class="av" style="background:#2563EB">${getInitials(m.name)}</div>`
      ).join('');
      const more = members.length > 4 ? `<div class="av more">+${members.length - 4}</div>` : '';

      return `<div class="board-card" onclick="navigateToBoard(${b.id})">
        <h3>${b.title}</h3>
        <div class="meta">
          <span class="count">${total}</span> tâches
          &middot; <span class="count">${members.length}</span> membres
        </div>
        <div class="bar-wrap"><div class="${barClass}" style="width:${progress}%"></div></div>
        <div class="footer">
          <span>${progress}% terminé</span>
          ${dueLabel ? `<span class="${dueClass}">${dueLabel}</span>` : ''}
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function renderBoard() {
  if (!requireAuth()) return;
  if (!currentBoardId) { showPage('dashboard'); return; }
  try {
    const board = await api.getBoard(currentBoardId);
    const boardCols = board.columns || [];
    const allCards = [];
    for (const col of boardCols) {
      const colCards = await api.getCards(col.id);
      allCards.push({ col, cards: colCards });
    }

    const totalCards = allCards.reduce((sum, g) => sum + g.cards.length, 0);
    const members = board.members || [];

    const avatars = members.slice(0, 4).map(m =>
      `<div class="av" style="background:#2563EB">${getInitials(m.name)}</div>`
    ).join('');
    const more = members.length > 4 ? `<div class="av more">+${members.length - 4}</div>` : '';

    const statusBadge = totalCards > 0
      ? `<span class="badge green">Actif</span>`
      : `<span class="badge">Vide</span>`;

    document.getElementById('board-top').innerHTML = `
      <h2>${board.title}</h2>
      ${statusBadge}
      <div class="avatar-stack">${avatars}${more}</div>
      <div class="right">
        <span class="mono" style="color:#94A3B8;font-size:12px">${totalCards} tâches</span>
        <button onclick="inviteMember()">Inviter</button>
        <button class="secondary" onclick="showAddCard()">+ Carte</button>
      </div>
    `;

    const container = document.getElementById('columns-container');
    if (boardCols.length === 0) {
      container.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><p>Ce tableau n'a pas encore de colonnes</p></div>`;
      return;
    }

    container.style.gridTemplateColumns = `repeat(${Math.min(boardCols.length, 4)}, 1fr)`;
    container.innerHTML = allCards.map(({ col, cards: colCards }) => `
      <div class="column">
        <div class="column-header">
          <h4>${col.title}</h4>
          <span class="count">${colCards.length}</span>
        </div>
        ${colCards.map(c => renderTaskCard(c)).join('')}
        <button class="ghost" style="width:100%;margin-top:4px;padding:8px" onclick="createCard(${col.id})">+ Ajouter</button>
      </div>
    `).join('');
  } catch (e) {
    toast(e.message, 'error');
  }
}

function renderTaskCard(card) {
  const cardLabels = card.labelIds.map(id => getLabelById(id)).filter(Boolean);
  const assignee = card.assigneeId ? getUserById(card.assigneeId) : null;
  let dueClass = '';
  if (card.dueDate) {
    if (isOverdue(card.dueDate)) dueClass = 'over';
    else if (isDueSoon(card.dueDate)) dueClass = 'due-soon';
  }

  return `<div class="task-card" onclick="openModal(${card.id})">
    <h5>${card.title}</h5>
    ${cardLabels.length ? `<div class="labels">${cardLabels.map(l => `<span class="lbl" style="background:${l.color}22;color:${l.color}">${l.name}</span>`).join('')}</div>` : ''}
    <div class="task-meta">
      <div class="avatar-stack">
        ${assignee ? `<div class="av" style="background:#2563EB;width:20px;height:20px;font-size:8px;border-color:#232435">${getInitials(assignee.name)}</div>` : ''}
      </div>
      ${card.dueDate ? `<span class="due ${dueClass}">${formatDate(card.dueDate)}</span>` : ''}
    </div>
  </div>`;
}

async function openModal(cardId) {
  if (!requireAuth()) return;
  try {
    const card = await api.getCard(cardId);
    const cardComments = await api.getComments(cardId);

    const labels = (card.labels || []).map(l =>
      `<span class="lbl" style="background:${l.color}22;color:${l.color}">${l.name}</span>`
    ).join('');

    const assignee = card.assignee;

    const commentsHtml = cardComments.map(c => {
      const author = c.authorId ? getUserById(c.authorId) : null;
      return `<div class="comment">
        <span class="author">${author ? author.name : 'Inconnu'}</span><span class="time">${timeAgo(c.createdAt)}</span>
        <p>${c.text}</p>
        ${c.authorId === currentUser.id ? `<button class="ghost" style="font-size:10px;color:#EF4444;padding:2px 4px;margin-top:2px" onclick="deleteComment(${c.id}, ${cardId})">Supprimer</button>` : ''}
      </div>`;
    }).join('');

    document.getElementById('modal-content').innerHTML = `
      <div class="modal-header">
        <h3>${card.title}</h3>
        <button class="close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-section">
        <h6>Description</h6>
        <p>${card.description || 'Aucune description'}</p>
      </div>
      ${labels ? `<div class="modal-section"><h6>Étiquettes</h6><div class="labels">${labels}</div></div>` : ''}
      <div class="modal-row">
        <div class="modal-field">
          <label>Assigné à</label>
          <p>${assignee ? assignee.name : 'Non assigné'}</p>
        </div>
        ${card.dueDate ? `<div class="modal-field"><label>Échéance</label><p class="${isOverdue(card.dueDate) ? 'over' : ''}" style="color:${isOverdue(card.dueDate) ? '#EF4444' : '#CBD5E1'}">${formatDate(card.dueDate)}</p></div>` : ''}
      </div>
      <div class="modal-section">
        <h6>Commentaires</h6>
        ${commentsHtml || '<p style="color:#64748B">Aucun commentaire</p>'}
        <div class="comment-form">
          <input type="text" id="comment-input" placeholder="Ajouter un commentaire...">
          <button onclick="addComment(${cardId})">Envoyer</button>
        </div>
      </div>
    `;
    document.getElementById('task-modal').classList.add('show');
    document.getElementById('comment-input')?.focus();
  } catch (e) {
    toast(e.message, 'error');
  }
}

function closeModal() {
  document.getElementById('task-modal').classList.remove('show');
}

async function addComment(cardId) {
  const input = document.getElementById('comment-input');
  if (!input || !input.value.trim()) return;
  const text = input.value.trim();
  input.value = '';
  try {
    await api.addComment(cardId, { text });
    await openModal(cardId);
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function deleteComment(commentId, cardId) {
  if (!confirm('Supprimer ce commentaire ?')) return;
  try {
    await api.deleteComment(commentId);
    await openModal(cardId);
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function showAddCard() {

  const title = prompt('Titre de la nouvelle carte :');
  if (!title || !title.trim()) return;
  const cols = columns.filter(c => c.boardId === currentBoardId).sort((a, b) => a.order - b.order);
  if (cols.length === 0) { toast('Aucune colonne disponible', 'error'); return; }
  const col = cols[0];
  try {
    await api.createCard(col.id, { title: title.trim() });
    toast('Carte créée');
    renderBoard();
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function updateLabel(id, field, value) {
  try {
    const data = {};
    data[field] = value;
    await api.updateLabel(id, data);
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function deleteLabel(id) {
  if (!confirm('Supprimer cette étiquette ?')) return;
  try {
    await api.deleteLabel(id);
    toast('Étiquette supprimée');
    renderSettings();
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function addColumn() {
  if (!currentBoardId) return;
  const title = prompt('Nom de la colonne :');
  if (!title || !title.trim()) return;
  try {
    await api.createColumn(currentBoardId, { title: title.trim() });
    toast('Colonne ajoutée');
    renderSettings();
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function renameColumn(id) {
  const col = columns.find(c => c.id === id);
  const title = prompt('Nouveau nom :', col?.title || '');
  if (!title || !title.trim()) return;
  try {
    await api.updateColumn(id, { title: title.trim() });
    toast('Colonne renommée');
    renderSettings();
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function deleteColumn(id) {
  if (!confirm('Supprimer cette colonne et toutes ses cartes ?')) return;
  try {
    await api.deleteColumn(id);
    toast('Colonne supprimée');
    renderSettings();
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function renderProfile() {
  if (!requireAuth()) return;
  try {
    const user = currentUser;
    const initials = getInitials(user.name);
    const parts = user.name.split(' ');
    const firstName = parts[0] || '';
    const lastName = parts.slice(1).join(' ') || '';

    document.getElementById('profile-layout').innerHTML = `
      <div class="profile-sidebar">
        <div class="avatar">${initials}</div>
        <h4>${user.name}</h4>
        <p>${user.email}</p>
        <p style="margin-top:4px;font-size:11px;color:#64748B">Membre depuis ${new Date(user.createdAt).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}</p>
      </div>
      <div class="profile-main">
        <div class="field-row">
          <div class="field">
            <label>Prénom</label>
            <input type="text" id="profile-firstname" value="${firstName}">
          </div>
          <div class="field">
            <label>Nom</label>
            <input type="text" id="profile-lastname" value="${lastName}">
          </div>
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="profile-email" value="${user.email}">
        </div>
        <div class="field">
          <label>Nouveau mot de passe (laisser vide pour ne pas changer)</label>
          <input type="password" id="profile-password" placeholder="Nouveau mot de passe">
        </div>
        <div class="actions">
          <button onclick="saveProfile()">Enregistrer</button>
        </div>
      </div>
    `;
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function saveProfile() {
  const firstName = document.getElementById('profile-firstname')?.value || '';
  const lastName = document.getElementById('profile-lastname')?.value || '';
  const email = document.getElementById('profile-email')?.value || '';
  const password = document.getElementById('profile-password')?.value;

  const data = { name: `${firstName} ${lastName}`.trim(), email };
  if (password) data.password = password;

  try {
    await api.updateMe(data);
    currentUser = await api.getMe();
    toggleAuthUI();
    toast('Profil mis à jour');
  } catch (e) {
    toast(e.message, 'error');
  }
}

// ========== AUTH HANDLERS ==========
function showRegister() {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('register-form').style.display = 'block';
  document.getElementById('login-error').style.display = 'none';
  document.getElementById('register-error').style.display = 'none';
}
function showLogin() {
  document.getElementById('login-form').style.display = 'block';
  document.getElementById('register-form').style.display = 'none';
  document.getElementById('login-error').style.display = 'none';
  document.getElementById('register-error').style.display = 'none';
}

async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  if (!email || !password) { errEl.textContent = 'Veuillez remplir tous les champs'; errEl.style.display = 'block'; return; }
  try {
    const result = await api.login({ email, password });
    currentUser = result.user;
    toggleAuthUI();
    renderDashboard();
    showPage('dashboard');
    toast('Connecté en tant que ' + currentUser.name);
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

async function handleRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const errEl = document.getElementById('register-error');
  if (!name || !email || !password) { errEl.textContent = 'Veuillez remplir tous les champs'; errEl.style.display = 'block'; return; }
  if (password.length < 8) { errEl.textContent = 'Mot de passe trop court (min 8 caractères)'; errEl.style.display = 'block'; return; }
  try {
    const result = await api.register({ name, email, password });
    currentUser = result.user;
    toggleAuthUI();
    renderDashboard();
    showPage('dashboard');
    toast('Bienvenue ' + currentUser.name + ' !');
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

// ========== EVENT WIRING ==========
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', async () => {
    const name = tab.dataset.tab;
    if (name === 'dashboard' || name === 'board' || name === 'settings' || name === 'profile') {
      if (!requireAuth()) return;
    }
    if (name === 'dashboard') { showPage('dashboard'); renderDashboard(); }
    else if (name === 'board') {
      if (!currentBoardId) { showPage('dashboard'); return; }
      showPage('board'); renderBoard();
    }
    else if (name === 'settings') { showPage('settings'); renderSettings(); }
    else if (name === 'profile') { showPage('profile'); renderProfile(); }
    else { showPage(name); }
  });
});

document.getElementById('login-btn').addEventListener('click', handleLogin);
document.getElementById('register-btn').addEventListener('click', handleRegister);
['login-email', 'login-password'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
});
['reg-name', 'reg-email', 'reg-password'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') handleRegister(); });
});

document.getElementById('task-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ========== INIT ==========
showLogin();

let saved = null;
try { saved = JSON.parse(localStorage.getItem('protask_session') || 'null'); } catch {}
if (saved && saved.user) {
  currentUser = saved.user;
  toggleAuthUI();
  renderDashboard();
  showPage('dashboard');
}

// Save session on change
const origLogin = api.login;
api.login = async function(data) {
  const result = await origLogin.call(this, data);
  try { localStorage.setItem('protask_session', JSON.stringify({ user: result.user, token: result.token })); } catch {}
  return result;
};
const origRegister = api.register;
api.register = async function(data) {
  const result = await origRegister.call(this, data);
  try { localStorage.setItem('protask_session', JSON.stringify({ user: result.user, token: result.token })); } catch {}
  return result;
};
</script>
</body>
</html>
