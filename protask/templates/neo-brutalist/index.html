<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProTask - Kanban</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, 'Arial Black', 'Impact', sans-serif;
    background: #fff;
    color: #000;
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.4;
  }
  a { color: #000; text-decoration: underline; cursor: pointer; }
  a:hover { background: #FFD700; }

  .nav {
    display: flex;
    border-bottom: 4px solid #000;
    background: #fff;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-btn {
    padding: 16px 28px;
    font-weight: 900;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .5px;
    cursor: pointer;
    border: none;
    background: #fff;
    color: #000;
    border-right: 3px solid #000;
    transition: none;
    font-family: inherit;
  }
  .nav-btn:hover { background: #FFD700; }
  .nav-btn.active { background: #000; color: #fff; }
  .nav-logo {
    padding: 14px 28px;
    font-weight: 900;
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: -1px;
    background: #FF3366;
    color: #fff;
    border-right: 3px solid #000;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-fill { flex: 1; border-right: 3px solid #000; }
  .nav-btn.logout { background: #FF3366; color: #fff; }

  .page { display: none; padding: 40px 48px; max-width: 1400px; margin: 0 auto; }
  .page.active { display: block; }

  .brut-card {
    background: #fff;
    border: 4px solid #000;
    box-shadow: 8px 8px 0 #000;
    padding: 24px;
  }
  .brut-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    font-weight: 900;
    font-size: 13px;
    text-transform: uppercase;
    border: 4px solid #000;
    box-shadow: 5px 5px 0 #000;
    cursor: pointer;
    background: #fff;
    color: #000;
    font-family: inherit;
    letter-spacing: .5px;
    transition: none;
  }
  .brut-btn:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 #000; }
  .brut-btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 #000; }
  .brut-btn.primary { background: #FF3366; color: #fff; }
  .brut-btn.gold { background: #FFD700; color: #000; }
  .brut-btn.cyan { background: #00E5FF; color: #000; }
  .brut-btn.sm { padding: 8px 16px; font-size: 11px; box-shadow: 4px 4px 0 #000; }
  .brut-btn:disabled { opacity: .5; pointer-events: none; }
  .brut-btn.green { background: #22c55e; color: #fff; }

  .brut-input {
    width: 100%;
    padding: 14px 16px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 700;
    border: 4px solid #000;
    background: #fff;
    color: #000;
    outline: none;
    transition: none;
  }
  .brut-input:focus { background: #FFD700; }

  .hr-thick {
    border: none;
    border-top: 4px solid #000;
    margin: 24px 0;
  }

  .page.page-login.active {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 68px);
    padding: 40px 48px;
  }
  .page-login .brut-card {
    width: 440px;
    padding: 48px 40px;
  }
  .login-logo {
    font-size: 48px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -3px;
    text-align: center;
    margin-bottom: 8px;
  }
  .login-logo span { background: #FF3366; color: #fff; padding: 0 8px; }
  .login-sub {
    text-align: center;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 32px;
    opacity: .6;
  }
  .login-field { margin-bottom: 20px; }
  .login-field label {
    display: block;
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .login-toggle {
    text-align: center;
    margin-top: 24px;
    font-size: 13px;
    font-weight: 700;
  }
  .login-toggle a { font-weight: 900; }
  .register-fields { display: none; margin-top: 4px; }
  .register-fields.show { display: block; }
  .login-error {
    background: #fef2f2;
    border: 3px solid #dc2626;
    color: #dc2626;
    padding: 10px 14px;
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    margin-bottom: 16px;
    display: none;
  }
  .login-error.show { display: block; }

  .dash-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
  }
  .dash-header h1 {
    font-size: 32px;
    text-transform: uppercase;
    letter-spacing: -1px;
  }
  .board-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 32px;
  }
  .board-card {
    border: 4px solid #000;
    box-shadow: 8px 8px 0 #000;
    padding: 0;
    cursor: pointer;
    transition: none;
    background: #fff;
  }
  .board-card:hover { transform: translate(-3px, -3px); box-shadow: 11px 11px 0 #000; }
  .board-card-color { height: 10px; }
  .board-card-body { padding: 24px 20px 20px; }
  .board-card-title {
    font-size: 18px;
    font-weight: 900;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .board-card-meta {
    display: flex;
    gap: 20px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .board-card-meta span { display: flex; align-items: center; gap: 6px; }

  .empty-state {
    border: 4px dashed #ccc;
    padding: 48px;
    text-align: center;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 16px;
    color: #999;
    grid-column: 1 / -1;
  }

  .board-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .board-top-left { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .board-top-left h2 {
    font-size: 28px;
    text-transform: uppercase;
    letter-spacing: -1px;
  }
  .board-avatars { display: flex; }
  .board-avatar {
    width: 36px; height: 36px;
    border: 3px solid #000;
    margin-right: -10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    background: #00E5FF;
  }
  .board-avatar:nth-child(2) { background: #FFD700; }
  .board-avatar:nth-child(3) { background: #FF3366; color: #fff; }
  .board-avatar:last-child { margin-right: 0; }

  .board-cols {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
    align-items: start;
  }
  .board-col {
    border: 4px solid #000;
    box-shadow: 8px 8px 0 #000;
    background: #fff;
  }
  .board-col-header {
    padding: 16px 20px;
    font-weight: 900;
    text-transform: uppercase;
    font-size: 14px;
    letter-spacing: .5px;
    border-bottom: 4px solid #000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f5f5f5;
  }
  .board-col-header .count {
    background: #000;
    color: #fff;
    padding: 2px 10px;
    font-size: 12px;
  }
  .board-col-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; }

  .task-card {
    border: 3px solid #000;
    box-shadow: 5px 5px 0 #000;
    padding: 16px;
    background: #fff;
    cursor: pointer;
    transition: none;
  }
  .task-card:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 #000; }
  .task-labels { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .task-label {
    padding: 2px 10px;
    font-size: 9px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: .5px;
    border: 2px solid #000;
  }
  .task-label.urgent { background: #FF3366; color: #fff; }
  .task-label.design { background: #00E5FF; }
  .task-label.dev { background: #FFD700; }
  .task-label.copy { background: #ccc; }
  .task-title {
    font-size: 14px;
    font-weight: 900;
    text-transform: uppercase;
    margin-bottom: 12px;
    line-height: 1.3;
  }
  .task-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: 700;
  }
  .task-assignee {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .task-assignee .mini-avatar {
    width: 24px; height: 24px;
    border: 2px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 900;
    background: #FFD700;
  }
  .task-date {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 200;
    justify-content: center;
    align-items: center;
    padding: 40px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    width: 640px;
    max-height: 90vh;
    overflow-y: auto;
    background: #fff;
    border: 4px solid #000;
    box-shadow: 12px 12px 0 #000;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px;
    border-bottom: 4px solid #000;
    background: #000;
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 1;
  }
  .modal-header h3 { font-size: 18px; text-transform: uppercase; letter-spacing: -0.5px; }
  .modal-close {
    width: 36px; height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid #fff;
    background: #FF3366;
    color: #fff;
    font-weight: 900;
    font-size: 18px;
    cursor: pointer;
    font-family: inherit;
  }
  .modal-body { padding: 24px; }
  .modal-body h4 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .modal-desc {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 24px;
    line-height: 1.6;
    text-transform: none;
    font-weight: 700;
  }
  .modal-meta-row {
    display: flex;
    gap: 40px;
    margin-bottom: 28px;
  }
  .modal-meta-row .label { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
  .modal-meta-row .value { font-size: 13px; font-weight: 700; margin-top: 4px; }
  .modal-comments { margin-bottom: 24px; }
  .modal-comment {
    border-left: 4px solid #000;
    padding: 12px 16px;
    margin-bottom: 12px;
  }
  .modal-comment-author { font-size: 11px; font-weight: 900; text-transform: uppercase; }
  .modal-comment-text { font-size: 13px; margin-top: 4px; font-weight: 500; }
  .modal-add-comment { display: flex; gap: 12px; }
  .modal-add-comment .brut-input { flex: 1; padding: 10px 14px; font-size: 13px; }
  .modal-add-comment .brut-btn { padding: 10px 20px; }

  .settings-wrap { max-width: 680px; }
  .settings-wrap h2 {
    font-size: 28px;
    text-transform: uppercase;
    letter-spacing: -1px;
    margin-bottom: 32px;
  }
  .settings-group { margin-bottom: 32px; }
  .settings-group label {
    display: block;
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .settings-group .brut-input { margin-bottom: 16px; }
  .settings-group textarea.brut-input { resize: vertical; min-height: 80px; font-family: inherit; }

  .settings-columns { margin-bottom: 24px; }
  .settings-columns h3 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 12px;
  }
  .settings-col-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 3px solid #000;
    padding: 10px 16px;
    margin-bottom: 10px;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 13px;
  }
  .settings-col-item .col-actions { display: flex; gap: 8px; }
  .settings-col-item .col-actions button {
    width: 30px; height: 30px;
    border: 3px solid #000;
    background: #fff;
    font-weight: 900;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .settings-col-item .col-actions button.del { background: #FF3366; color: #fff; }

  .settings-labels { margin-bottom: 28px; }
  .settings-labels h3 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 12px;
  }
  .settings-label-item {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .settings-label-item .color-swatch {
    width: 32px; height: 32px;
    border: 3px solid #000;
  }
  .settings-label-item span { font-weight: 700; text-transform: uppercase; font-size: 12px; }

  .profile-wrap { max-width: 560px; }
  .profile-header {
    display: flex;
    align-items: center;
    gap: 32px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }
  .profile-avatar {
    width: 120px; height: 120px;
    border: 4px solid #000;
    box-shadow: 8px 8px 0 #FFD700;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    font-weight: 900;
    text-transform: uppercase;
    background: #00E5FF;
    flex-shrink: 0;
  }
  .profile-info h2 {
    font-size: 28px;
    text-transform: uppercase;
    letter-spacing: -1px;
  }
  .profile-info .email {
    font-size: 14px;
    font-weight: 700;
    margin-top: 4px;
    opacity: .6;
  }
  .profile-form label {
    display: block;
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .profile-form .brut-input { margin-bottom: 20px; }
  .profile-pw-section {
    border: 4px solid #000;
    box-shadow: 6px 6px 0 #000;
    padding: 24px;
    margin-bottom: 28px;
  }
  .profile-pw-section h3 {
    font-size: 14px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .toast {
    position: fixed;
    bottom: 32px;
    right: 32px;
    padding: 16px 24px;
    border: 4px solid #000;
    box-shadow: 6px 6px 0 #000;
    font-weight: 900;
    text-transform: uppercase;
    font-size: 13px;
    z-index: 300;
    opacity: 0;
    transform: translateY(20px);
    transition: all .3s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: #22c55e; color: #fff; }
  .toast.error { background: #FF3366; color: #fff; }

  @media (min-width: 1440px) {
    .page { padding: 40px 48px; max-width: 1400px; }
    .board-cols { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 1024px) {
    .page { padding: 28px 32px; }
    .nav-btn { padding: 14px 20px; font-size: 12px; }
    .nav-logo { padding: 12px 20px; font-size: 18px; }
    .dash-header h1 { font-size: 26px; }
    .board-top-left h2 { font-size: 24px; }
    .dash-header { margin-bottom: 28px; }
    .board-top { margin-bottom: 24px; }
    .brut-card { padding: 20px; }
    .board-grid { gap: 24px; }
    .board-cols { gap: 20px; }
  }
  @media (max-width: 768px) {
    .board-cols { grid-template-columns: repeat(2, 1fr); }
    .board-grid { grid-template-columns: repeat(2, 1fr); }
    .page { padding: 20px 24px; }
    .dash-header h1 { font-size: 22px; }
    .board-top-left h2 { font-size: 20px; }
    .brut-card { box-shadow: 6px 6px 0 #000; }
    .board-col { box-shadow: 6px 6px 0 #000; }
    .board-card { box-shadow: 6px 6px 0 #000; }
    .modal { width: 90vw; }
    .page.page-login.active { padding: 20px 24px; }
    .page-login .brut-card { width: 100%; max-width: 440px; padding: 36px 28px; }
    .login-logo { font-size: 40px; }
    .board-grid { gap: 20px; }
    .board-cols { gap: 16px; }
    .settings-wrap, .profile-wrap { max-width: 100%; }
    .board-card-body { padding: 18px 16px 16px; }
  }
  @media (max-width: 600px) {
    .nav { flex-wrap: wrap; border-bottom-width: 3px; }
    .nav-btn { flex: 1 1 auto; padding: 12px 10px; font-size: 10px; border-right-width: 2px; min-height: 44px; }
    .nav-logo { padding: 10px 14px; font-size: 14px; border-right-width: 2px; min-height: 44px; }
    .nav-fill { display: none; }
    .page { padding: 16px; }
    .board-cols { grid-template-columns: 1fr; gap: 16px; }
    .board-grid { grid-template-columns: 1fr; gap: 16px; }
    .dash-header { flex-direction: column; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
    .dash-header h1 { font-size: 18px; }
    .board-top { flex-direction: column; align-items: flex-start; }
    .board-top-left { gap: 12px; }
    .board-top-left h2 { font-size: 16px; }
    .board-avatars { margin-top: 4px; }
    .brut-card { padding: 14px; border-width: 3px; box-shadow: 4px 4px 0 #000; }
    .board-col { border-width: 3px; box-shadow: 4px 4px 0 #000; }
    .board-col-header { padding: 12px 14px; font-size: 11px; border-bottom-width: 3px; }
    .board-col-header .count { font-size: 10px; padding: 1px 8px; }
    .board-col-body { padding: 10px; gap: 10px; }
    .task-card { padding: 12px; border-width: 2px; box-shadow: 3px 3px 0 #000; }
    .task-card:hover { transform: none; box-shadow: 3px 3px 0 #000; }
    .task-title { font-size: 12px; margin-bottom: 8px; }
    .task-footer { font-size: 10px; flex-wrap: wrap; gap: 6px; }
    .board-card { border-width: 3px; box-shadow: 4px 4px 0 #000; }
    .board-card:hover { transform: none; box-shadow: 4px 4px 0 #000; }
    .board-card-body { padding: 14px 12px 12px; }
    .board-card-title { font-size: 14px; margin-bottom: 10px; }
    .board-card-meta { font-size: 10px; gap: 12px; }
    .brut-btn { padding: 10px 16px; font-size: 11px; box-shadow: 4px 4px 0 #000; min-height: 44px; }
    .brut-btn:hover { transform: none; box-shadow: 4px 4px 0 #000; }
    .brut-btn.sm { padding: 8px 12px; font-size: 10px; min-height: 44px; }
    .modal-overlay { padding: 8px; }
    .modal { width: 100%; border-width: 3px; box-shadow: 5px 5px 0 #000; }
    .modal-header { padding: 12px 14px; }
    .modal-header h3 { font-size: 13px; }
    .modal-body { padding: 14px; }
    .modal-close { width: 32px; height: 32px; font-size: 14px; border-width: 2px; min-height: 44px; min-width: 44px; }
    .modal-meta-row { flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .modal-comment { padding: 10px 12px; }
    .modal-add-comment { flex-direction: column; gap: 8px; }
    .modal-add-comment .brut-input { width: 100%; }
    .modal-desc { font-size: 13px; }
    .hr-thick { margin: 14px 0; border-top-width: 3px; }
    .page.page-login.active { padding: 16px; min-height: calc(100vh - 56px); }
    .page-login .brut-card { padding: 24px 16px; }
    .login-logo { font-size: 28px; letter-spacing: -2px; }
    .login-logo span { padding: 0 4px; }
    .login-sub { font-size: 9px; margin-bottom: 24px; }
    .login-field { margin-bottom: 14px; }
    .login-field label { font-size: 10px; }
    .login-toggle { font-size: 12px; margin-top: 18px; }
    .settings-wrap h2 { font-size: 20px; margin-bottom: 20px; }
    .settings-group { margin-bottom: 20px; }
    .settings-group .brut-input { margin-bottom: 12px; }
    .settings-columns h3, .settings-labels h3 { font-size: 12px; }
    .settings-col-item { padding: 8px 12px; font-size: 11px; }
    .settings-col-item .col-actions button { width: 28px; height: 28px; font-size: 12px; min-height: 44px; min-width: 44px; }
    .profile-header { gap: 16px; margin-bottom: 24px; }
    .profile-avatar { width: 72px; height: 72px; font-size: 28px; box-shadow: 5px 5px 0 #FFD700; border-width: 3px; }
    .profile-info h2 { font-size: 18px; }
    .profile-info .email { font-size: 12px; }
    .profile-form .brut-input { margin-bottom: 14px; }
    .profile-pw-section { padding: 14px; box-shadow: 4px 4px 0 #000; border-width: 3px; margin-bottom: 20px; }
    .profile-pw-section h3 { font-size: 12px; margin-bottom: 12px; }
    .board-avatar { width: 28px; height: 28px; font-size: 9px; border-width: 2px; margin-right: -8px; }
    .task-label { font-size: 8px; padding: 1px 8px; border-width: 1.5px; }
    .brut-input { padding: 12px 14px; font-size: 13px; border-width: 3px; }
    body { font-size: 12px; }

async function renderDashboard() {
  const grid = document.getElementById('dash-grid');
  grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:48px;font-weight:900;">Chargement...</div>';
  try {
    const boardList = await api.getBoards();
    if (boardList.length === 0) {
      grid.innerHTML = '<div class="empty-state">Aucun board pour le moment. Créez-en un !</div>';
      return;
    }
    grid.innerHTML = boardList.map(b => `
      <div class="board-card" data-board-id="${b.id}">
        <div class="board-card-color" style="background:${b.color || '#000'};"></div>
        <div class="board-card-body">
          <div class="board-card-title">${b.title}</div>
          <div class="board-card-meta">
            <span>&#9679; ${(b.members || []).length} membres</span>
            <span>&#9632; ${b._cardCount || 0} cartes</span>
          </div>
        </div>
      </div>
    `).join('');
    grid.querySelectorAll('.board-card').forEach(el => {
      el.addEventListener('click', async () => {
        activeBoardId = Number(el.dataset.boardId);
        await renderBoard(activeBoardId);
        navigate('board');
      });
    });
  } catch (err) {
    grid.innerHTML = '<div class="empty-state">Erreur : ' + err.message + '</div>';
  }
}

    navigate('board');

    toast(err.message, 'error');

async function renderBoard(boardId) {
  const colsContainer = document.getElementById('board-cols');
  colsContainer.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:48px;font-weight:900;">Chargement...</div>';
  try {
    const board = await api.getBoard(boardId);
    document.getElementById('board-title').textContent = board.title;
    const avatarsEl = document.getElementById('board-avatars');
    const mems = board.members || [];
    avatarsEl.innerHTML = mems.slice(0, 3).map(m => {
      const initials = m.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
      return `<div class="board-avatar">${initials}</div>`;
    }).join('');
    if (mems.length > 3) avatarsEl.innerHTML += `<div class="board-avatar">+${mems.length - 3}</div>`;
    if (mems.length === 0) avatarsEl.innerHTML = '';

    const bCols = board.columns || [];
    if (bCols.length === 0) {
      colsContainer.innerHTML = '<div class="empty-state">Aucune colonne dans ce board</div>';
      return;
    }
    colsContainer.innerHTML = bCols.map(col => `
      <div class="board-col" data-col-id="${col.id}">
        <div class="board-col-header">
          <span>&#9632; ${col.title}</span>
          <span class="count" id="col-count-${col.id}">0</span>
        </div>
        <div class="board-col-body" id="col-body-${col.id}">
          <div style="padding:16px;text-align:center;font-weight:700;">Chargement...</div>
        </div>
      </div>
    `).join('');

    for (const col of bCols) {
      loadColumnCards(col.id);
    }
  } catch (err) {
    colsContainer.innerHTML = '<div class="empty-state">Erreur : ' + err.message + '</div>';
  }
}

async function loadColumnCards(colId) {

    if (colCards.length === 0) {
      body.innerHTML = '<div style="padding:16px;text-align:center;font-weight:700;font-size:11px;text-transform:uppercase;opacity:.4;">Aucune carte</div>';
      return;
    }
    body.innerHTML = colCards.map(ca => {
      const labelsHtml = (ca.labels || []).map(l => {
        const cls = l.name.toLowerCase() === 'urgent' ? 'urgent' : l.name.toLowerCase() === 'design' ? 'design' : l.name.toLowerCase() === 'dev' ? 'dev' : l.name.toLowerCase() === 'copy' ? 'copy' : '';
        return `<span class="task-label ${cls}">${l.name}</span>`;
      }).join('');
      const assigneeName = ca.assignee ? ca.assignee.name.split(' ')[0] : '';
      const initials = ca.assignee ? ca.assignee.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2) : '--';
      const dateStr = ca.dueDate ? new Date(ca.dueDate + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' }) : '';
      return `<div class="task-card" data-card-id="${ca.id}" onclick="openCardModal(${ca.id})">
        ${labelsHtml ? `<div class="task-labels">${labelsHtml}</div>` : ''}
        <div class="task-title">${ca.title}</div>
        <div class="task-footer">
          ${ca.assignee ? `<span class="task-assignee"><span class="mini-avatar">${initials}</span> ${assigneeName}</span>` : ''}
          ${dateStr ? `<span class="task-date">&#9679; ${dateStr}</span>` : ''}
        </div>
      </div>`;
    }).join('');
  } catch (err) {
    const body = document.getElementById('col-body-' + colId);
    if (body) body.innerHTML = '<div style="padding:16px;text-align:center;font-weight:700;color:#FF3366;">Erreur</div>';
  }
}

document.getElementById('board-invite-btn').addEventListener('click', async () => {
  const email = prompt('Email du membre à inviter :');
  if (!email || !email.trim()) return;
  try {
    await api.inviteMember(activeBoardId, email.trim());
    toast('Invitation envoyée à ' + email.trim());
  } catch (err) {
    toast(err.message, 'error');
  }
});

// =========================================================================
// CARD MODAL
// =========================================================================
async function openCardModal(cardId) {
  activeCardId = cardId;
  try {
    const card = await api.getCard(cardId);
    const cardComments = await api.getComments(cardId);
    document.getElementById('modal-title').textContent = card.title;
    document.getElementById('modal-desc').textContent = card.description || 'Aucune description.';
    const assigneeName = card.assignee ? card.assignee.name : 'Non assigné';
    document.getElementById('modal-assignee').textContent = assigneeName;
    document.getElementById('modal-due').textContent = card.dueDate ? new Date(card.dueDate + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : 'Non définie';
    document.getElementById('modal-labels').textContent = (card.labels || []).map(l => l.name).join(', ') || 'Aucun';
    const commentsEl = document.getElementById('modal-comments');
    if (cardComments.length === 0) {
      commentsEl.innerHTML = '<div class="modal-comment"><div class="modal-comment-author">Système</div><div class="modal-comment-text">Aucun commentaire pour cette tâche.</div></div>';
    } else {
      commentsEl.innerHTML = cardComments.map(cm => {
        const authorName = cm.author ? cm.author.name : 'Utilisateur inconnu';
        const dateStr = new Date(cm.createdAt).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
        return `<div class="modal-comment"><div class="modal-comment-author">${authorName} &#9679; ${dateStr}</div><div class="modal-comment-text">${cm.text}</div></div>`;
      }).join('');
    }
    document.getElementById('modal-overlay').classList.add('show');
  } catch (err) {
    toast(err.message, 'error');
  }
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
  activeCardId = null;
}

document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});

document.getElementById('modal-comment-btn').addEventListener('click', async () => {
  const input = document.getElementById('modal-comment-input');
  const text = input.value.trim();
  if (!text || !activeCardId) return;
  try {
    await api.addComment(activeCardId, { text });
    input.value = '';
    const comments = await api.getComments(activeCardId);
    const commentsEl = document.getElementById('modal-comments');
    commentsEl.innerHTML = comments.map(cm => {
      const authorName = cm.author ? cm.author.name : 'Utilisateur inconnu';
      const dateStr = new Date(cm.createdAt).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
      return `<div class="modal-comment"><div class="modal-comment-author">${authorName} &#9679; ${dateStr}</div><div class="modal-comment-text">${cm.text}</div></div>`;
    }).join('');
    toast('Commentaire ajouté');
  } catch (err) {
    toast(err.message, 'error');
  }
});

document.getElementById('modal-comment-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('modal-comment-btn').click();
});

// =========================================================================
// SETTINGS
// =========================================================================
async function renderSettings(boardId) {
  try {
    const board = await api.getBoard(boardId);
    const bCols = board.columns || [];
    const bLabels = await api.getLabels(boardId);
    document.getElementById('settings-board-name').value = board.title;
    document.getElementById('settings-board-desc').value = board.description || '';

    const colList = document.getElementById('settings-col-list');
    colList.innerHTML = bCols.map((col, i) => `
      <div class="settings-col-item" data-col-id="${col.id}">
        <span>&#9632; ${col.title}</span>
        <div class="col-actions">
          <button class="col-edit" title="Modifier">&#9998;</button>
          <button class="col-del del" title="Supprimer">&#10005;</button>
        </div>
      </div>
    `).join('');
    colList.querySelectorAll('.col-edit').forEach((btn, i) => {
      btn.addEventListener('click', async () => {
        const col = bCols[i];
        const newTitle = prompt('Nouveau nom de la colonne :', col.title);
        if (newTitle && newTitle.trim()) {
          await api.updateColumn(col.id, { title: newTitle.trim() });
          await renderSettings(boardId);
          toast('Colonne renommée');
        }
      });
    });
    colList.querySelectorAll('.col-del').forEach((btn, i) => {
      btn.addEventListener('click', async () => {
        const col = bCols[i];
        if (confirm('Supprimer la colonne "' + col.title + '" ?')) {
          await api.deleteColumn(col.id);
          await renderSettings(boardId);
          toast('Colonne supprimée');
        }
      });
    });

    const labelList = document.getElementById('settings-label-list');
    labelList.innerHTML = bLabels.map(l => `
      <div class="settings-label-item" data-label-id="${l.id}">
        <div class="color-swatch" style="background:${l.color};"></div>
        <span>${l.name}</span>
      </div>
    `).join('');
  } catch (err) {
    toast(err.message, 'error');
  }
}

document.getElementById('settings-save-btn').addEventListener('click', async () => {
  if (!activeBoardId) { toast('Aucun board sélectionné', 'error'); return; }
  const title = document.getElementById('settings-board-name').value.trim();
  const desc = document.getElementById('settings-board-desc').value.trim();
  if (!title) { toast('Le nom du board est requis', 'error'); return; }
  try {
    await api.updateBoard(activeBoardId, { title, description: desc });
    toast('Board mis à jour');
  } catch (err) {
    toast(err.message, 'error');
  }
});

document.getElementById('settings-add-col').addEventListener('click', async () => {
  if (!activeBoardId) return;
  const title = prompt('Nom de la nouvelle colonne :');
  if (!title || !title.trim()) return;
  try {
    await api.createColumn(activeBoardId, { title: title.trim() });
    await renderSettings(activeBoardId);
    toast('Colonne ajoutée');
  } catch (err) {
    toast(err.message, 'error');
  }
});

document.getElementById('settings-add-label').addEventListener('click', async () => {
  if (!activeBoardId) return;
  const name = prompt('Nom du nouveau label :');
  if (!name || !name.trim()) return;
  const color = prompt('Couleur hexadécimale (ex: #4F46E5) :', '#4F46E5');
  if (!color || !color.trim()) return;
  try {
    await api.createLabel(activeBoardId, { name: name.trim(), color: color.trim() });
    await renderSettings(activeBoardId);
    toast('Label ajouté');
  } catch (err) {
    toast(err.message, 'error');
  }
});

// =========================================================================
// PROFILE
// =========================================================================
function renderProfile() {
  if (!currentUser) return;
  const initials = currentUser.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  document.getElementById('profile-avatar').textContent = initials;
  document.getElementById('profile-name-display').textContent = currentUser.name;
  document.getElementById('profile-email-display').textContent = currentUser.email;
  document.getElementById('profile-name').value = currentUser.name;
  document.getElementById('profile-email').value = currentUser.email;
  document.getElementById('profile-pw-current').value = '';
  document.getElementById('profile-pw-new').value = '';
  document.getElementById('profile-pw-confirm').value = '';
}

document.getElementById('profile-save-btn').addEventListener('click', async () => {
  if (!currentUser) return;
  const name = document.getElementById('profile-name').value.trim();
  const email = document.getElementById('profile-email').value.trim();
  const pwCurrent = document.getElementById('profile-pw-current').value;
  const pwNew = document.getElementById('profile-pw-new').value;
  const pwConfirm = document.getElementById('profile-pw-confirm').value;
  if (!name || !email) { toast('Nom et email requis', 'error'); return; }
  const updateData = { name, email };
  if (pwNew || pwCurrent || pwConfirm) {
    if (!pwCurrent) { toast('Mot de passe actuel requis', 'error'); return; }
    if (pwNew !== pwConfirm) { toast('Les nouveaux mots de passe ne correspondent pas', 'error'); return; }
    if (pwNew.length < 8) { toast('Minimum 8 caractères', 'error'); return; }
    const user = users.find(u => u.id === currentUser.id);
    if (!user || user.password !== pwCurrent) { toast('Mot de passe actuel incorrect', 'error'); return; }
    updateData.password = pwNew;
  }
  try {
    await api.updateMe(updateData);
    renderProfile();
    toast('Profil mis à jour');
  } catch (err) {
    toast(err.message, 'error');
  }
});
</script>
