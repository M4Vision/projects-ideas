<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProTask — Kanban</title>
<style>
:root {
  --bg: #fff;
  --fg: #000;
  --accent: #FF3366;
  --gold: #FFD700;
  --cyan: #00E5FF;
  --green: #22c55e;
  --border: #000;
  --border-w: 4px;
  --shadow: 8px 8px 0 #000;
  --shadow-btn: 5px 5px 0 #000;
  --radius: 0;
  --font: system-ui, 'Arial Black', 'Impact', sans-serif;
  --font-head: 'Impact', 'Arial Black', sans-serif;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--fg);min-height:100vh;font-size:14px;line-height:1.4}
a{color:#000;text-decoration:underline;cursor:pointer}
a:hover{background:var(--gold)}

.nav{display:flex;border-bottom:var(--border-w) solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100}
.nav-btn{padding:16px 28px;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;border:none;background:var(--bg);color:var(--fg);border-right:3px solid var(--border);transition:none;font-family:inherit}
.nav-btn:hover{background:var(--gold)}
.nav-btn.active{background:#000;color:#fff}
.nav-logo{padding:14px 28px;font-weight:900;font-size:20px;text-transform:uppercase;letter-spacing:-1px;background:var(--accent);color:#fff;border-right:3px solid var(--border);display:flex;align-items:center;gap:8px}
.nav-fill{flex:1;border-right:3px solid var(--border)}
.nav-btn.logout{background:var(--accent);color:#fff}

.page{display:none;padding:40px 48px;max-width:1400px;margin:0 auto}
.page.active{display:block}

.brutal-card{background:var(--bg);border:var(--border-w) solid var(--border);box-shadow:var(--shadow);padding:24px}
.brutal-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;font-weight:900;font-size:13px;text-transform:uppercase;border:var(--border-w) solid var(--border);box-shadow:var(--shadow-btn);cursor:pointer;background:var(--bg);color:var(--fg);font-family:inherit;letter-spacing:.5px;transition:none}
.brutal-btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--border)}
.brutal-btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--border)}
.brutal-btn.primary{background:var(--accent);color:#fff}
.brutal-btn.gold{background:var(--gold)}
.brutal-btn.cyan{background:var(--cyan)}
.brutal-btn.sm{padding:8px 16px;font-size:11px;box-shadow:4px 4px 0 var(--border)}
.brutal-btn.green{background:var(--green);color:#fff}
.brutal-btn.block{width:100%;justify-content:center}

.brutal-input{width:100%;padding:14px 16px;font-size:14px;font-family:inherit;font-weight:700;border:var(--border-w) solid var(--border);background:var(--bg);outline:none;transition:none}
.brutal-input:focus{background:var(--gold)}

/* Login */
.page-login{display:flex;justify-content:center;align-items:center;min-height:calc(100vh - 68px)}
.page-login .brutal-card{width:440px;padding:48px 40px}
.login-logo{font-size:48px;font-weight:900;text-transform:uppercase;letter-spacing:-3px;text-align:center;margin-bottom:8px}
.login-logo span{background:var(--accent);color:#fff;padding:0 8px}
.login-sub{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:2px;margin-bottom:32px;opacity:.6}
.login-field{margin-bottom:20px}
.login-field label{display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.login-toggle{text-align:center;margin-top:24px;font-size:13px;font-weight:700}
.register-fields{display:none}
.register-fields.show{display:block}
.login-error{background:#fef2f2;border:3px solid #dc2626;color:#dc2626;padding:10px 14px;font-weight:700;font-size:12px;text-transform:uppercase;margin-bottom:16px;display:none}
.login-error.show{display:block}

/* Dashboard */
.dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}
.dash-header h1{font-size:32px;text-transform:uppercase;letter-spacing:-1px}
.board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:32px}
.board-card{border:var(--border-w) solid var(--border);box-shadow:var(--shadow);cursor:pointer;background:var(--bg)}
.board-card:hover{transform:translate(-3px,-3px);box-shadow:11px 11px 0 var(--border)}
.board-card-color{height:10px}
.board-card-body{padding:24px 20px 20px}
.board-card-title{font-size:18px;font-weight:900;text-transform:uppercase;margin-bottom:16px}
.board-card-meta{display:flex;gap:20px;font-size:12px;font-weight:700;text-transform:uppercase}
.empty-state{border:4px dashed #ccc;padding:48px;text-align:center;font-weight:700;text-transform:uppercase;font-size:16px;color:#999;grid-column:1/-1}

/* Board */
.board-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;flex-wrap:wrap;gap:16px}
.board-top-left{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.board-top-left h2{font-size:28px;text-transform:uppercase;letter-spacing:-1px}
.board-avatars{display:flex}
.board-avatar{width:36px;height:36px;border:3px solid var(--border);margin-right:-10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;text-transform:uppercase;background:var(--cyan)}
.board-avatar:nth-child(2){background:var(--gold)}
.board-avatar:nth-child(3){background:var(--accent);color:#fff}
.board-avatar:last-child{margin-right:0}
.board-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;align-items:start}
.board-col{border:var(--border-w) solid var(--border);box-shadow:var(--shadow);background:var(--bg)}
.board-col-header{padding:16px 20px;font-weight:900;text-transform:uppercase;font-size:14px;letter-spacing:.5px;border-bottom:var(--border-w) solid var(--border);display:flex;justify-content:space-between;align-items:center;background:#f5f5f5}
.board-col-header .count{background:#000;color:#fff;padding:2px 10px;font-size:12px}
.board-col-body{padding:16px;display:flex;flex-direction:column;gap:16px;min-height:80px}

/* Card */
.task-card{border:3px solid var(--border);box-shadow:5px 5px 0 var(--border);padding:16px;background:var(--bg);cursor:grab;transition:none;position:relative}
.task-card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--border)}
.task-card.dragging{opacity:.4;transform:scale(.95)}
.task-card.drag-over{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan)}
.task-card .card-labels{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.task-card .card-label{padding:2px 10px;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;border:2px solid var(--border)}
.task-card .card-title{font-size:14px;font-weight:900;text-transform:uppercase;margin-bottom:12px;line-height:1.3}
.task-card .card-footer{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;flex-wrap:wrap;gap:6px}
.task-card .card-assignee{display:flex;align-items:center;gap:6px}
.task-card .mini-avatar{width:24px;height:24px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;background:var(--gold)}
.col-dropzone.drag-over{background:#f0f0f0;outline:3px dashed var(--cyan);outline-offset:-3px}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;justify-content:center;align-items:center;padding:40px}
.modal-overlay.show{display:flex}
.modal{width:640px;max-height:90vh;overflow-y:auto;background:var(--bg);border:var(--border-w) solid var(--border);box-shadow:12px 12px 0 var(--border)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:var(--border-w) solid var(--border);background:#000;color:#fff;position:sticky;top:0;z-index:1}
.modal-header h3{font-size:18px;text-transform:uppercase;letter-spacing:-.5px}
.modal-close{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;background:var(--accent);color:#fff;font-weight:900;font-size:18px;cursor:pointer;font-family:inherit}
.modal-body{padding:24px}
.modal-body h4{font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.modal-desc{font-size:14px;font-weight:700;margin-bottom:24px;line-height:1.6}
.modal-meta-row{display:flex;gap:40px;margin-bottom:28px;flex-wrap:wrap}
.modal-meta-row .label{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.modal-meta-row .value{font-size:13px;font-weight:700;margin-top:4px}
.modal-comments{margin-bottom:24px}
.modal-comment{border-left:4px solid var(--border);padding:12px 16px;margin-bottom:12px}
.modal-comment-author{font-size:11px;font-weight:900;text-transform:uppercase}
.modal-comment-text{font-size:13px;margin-top:4px;font-weight:500}
.modal-add-comment{display:flex;gap:12px}
.modal-add-comment .brutal-input{flex:1;padding:10px 14px;font-size:13px}
.unsaved-indicator{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin-left:12px}
.unsaved-indicator .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.label-picker{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.label-picker div{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:3px solid var(--border);font-size:12px;font-weight:700;text-transform:uppercase;user-select:none;transition:opacity .15s}
.label-picker div.checked{opacity:1;box-shadow:3px 3px 0 var(--border)}
.label-picker div:not(.checked){opacity:.5}

/* Settings */
.settings-wrap{max-width:680px}
.settings-wrap h2{font-size:28px;text-transform:uppercase;letter-spacing:-1px;margin-bottom:32px}
.settings-group{margin-bottom:32px}
.settings-group label{display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.settings-group textarea.brutal-input{resize:vertical;min-height:80px;font-family:inherit}
.settings-cols{margin-bottom:24px}
.settings-cols h3{font-size:14px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.settings-col-item{display:flex;align-items:center;justify-content:space-between;border:3px solid var(--border);padding:10px 16px;margin-bottom:10px;font-weight:700;text-transform:uppercase;font-size:13px}
.settings-col-item .col-actions{display:flex;gap:8px}
.settings-col-item .col-actions button{width:30px;height:30px;border:3px solid var(--border);background:var(--bg);font-weight:900;cursor:pointer;font-family:inherit;font-size:14px;display:flex;align-items:center;justify-content:center}
.settings-col-item .col-actions button.del{background:var(--accent);color:#fff}
.settings-labels{margin-bottom:28px}
.settings-labels h3{font-size:14px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.settings-label-item{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.settings-label-item .color-swatch{width:32px;height:32px;border:3px solid var(--border)}
.settings-label-item span{font-weight:700;text-transform:uppercase;font-size:12px}

/* Profile */
.profile-wrap{max-width:560px}
.profile-header{display:flex;align-items:center;gap:32px;margin-bottom:40px;flex-wrap:wrap}
.profile-avatar{width:120px;height:120px;border:var(--border-w) solid var(--border);box-shadow:8px 8px 0 var(--gold);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;text-transform:uppercase;background:var(--cyan);flex-shrink:0}
.profile-info h2{font-size:28px;text-transform:uppercase;letter-spacing:-1px}
.profile-info .email{font-size:14px;font-weight:700;margin-top:4px;opacity:.6}
.profile-form label{display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.profile-form .brutal-input{margin-bottom:20px}
.profile-pw-section{border:var(--border-w) solid var(--border);box-shadow:6px 6px 0 var(--border);padding:24px;margin-bottom:28px}
.profile-pw-section h3{font-size:14px;text-transform:uppercase;margin-bottom:16px}
.hr{border:none;border-top:var(--border-w) solid var(--border);margin:24px 0}

/* Toast */
.toast{position:fixed;bottom:32px;right:32px;padding:16px 24px;border:var(--border-w) solid var(--border);box-shadow:6px 6px 0 var(--border);font-weight:900;text-transform:uppercase;font-size:13px;z-index:300;opacity:0;transform:translateY(20px);transition:all .3s ease;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:var(--green);color:#fff}
.toast.error{background:var(--accent);color:#fff}

/* Dialog */
.dialog-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;justify-content:center;align-items:center;padding:40px}
.dialog-overlay.show{display:flex}
.dialog{width:440px;background:var(--bg);border:var(--border-w) solid var(--border);box-shadow:12px 12px 0 var(--border)}
.dialog-header{padding:16px 20px;border-bottom:var(--border-w) solid var(--border);background:#000;color:#fff;font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
.dialog-body{padding:24px 20px}
.dialog-body p{font-weight:700;font-size:14px;margin-bottom:8px}
.dialog-footer{display:flex;gap:12px;padding:0 20px 20px;justify-content:flex-end}
.dialog-footer .brutal-btn{min-width:100px;justify-content:center}

@media(min-width:1440px){.page{padding:40px 48px;max-width:1400px}.board-cols{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1024px){
  .page{padding:28px 32px}.nav-btn{padding:14px 20px;font-size:12px}.nav-logo{padding:12px 20px;font-size:18px}
  .dash-header h1{font-size:26px}.board-top-left h2{font-size:24px}.brutal-card{padding:20px}.board-cols{gap:20px}
}
@media(max-width:768px){
  .board-cols{grid-template-columns:repeat(2,1fr)}.board-grid{grid-template-columns:repeat(2,1fr)}
  .page{padding:20px 24px}.dash-header h1{font-size:22px}.board-top-left h2{font-size:20px}
  .brutal-card{box-shadow:6px 6px 0 var(--border)}.board-col{box-shadow:6px 6px 0 var(--border)}
  .board-card{box-shadow:6px 6px 0 var(--border)}.modal{width:90vw}
  .page-login .brutal-card{width:100%;max-width:440px;padding:36px 28px}.login-logo{font-size:40px}
  .settings-wrap,.profile-wrap{max-width:100%}
}
@media(max-width:600px){
  .nav{flex-wrap:wrap;border-bottom-width:3px}
  .nav-btn{flex:1 1 auto;padding:12px 10px;font-size:10px;border-right-width:2px;min-height:44px}
  .nav-logo{padding:10px 14px;font-size:14px;border-right-width:2px;min-height:44px}
  .nav-fill{display:none}.page{padding:16px}
  .board-cols{grid-template-columns:1fr;gap:16px}.board-grid{grid-template-columns:1fr;gap:16px}
  .dash-header{flex-direction:column;align-items:flex-start;gap:12px;margin-bottom:20px}
  .dash-header h1{font-size:18px}.board-top{flex-direction:column;align-items:flex-start}
  .board-top-left h2{font-size:16px}
  .brutal-card{padding:14px;border-width:3px;box-shadow:4px 4px 0 var(--border)}
  .board-col{border-width:3px;box-shadow:4px 4px 0 var(--border)}
  .board-col-header{padding:12px 14px;font-size:11px;border-bottom-width:3px}
  .board-col-body{padding:10px;gap:10px}
  .task-card{padding:12px;border-width:2px;box-shadow:3px 3px 0 var(--border)}
  .task-card:hover{transform:none;box-shadow:3px 3px 0 var(--border)}
  .board-card{border-width:3px;box-shadow:4px 4px 0 var(--border)}
  .board-card:hover{transform:none;box-shadow:4px 4px 0 var(--border)}
  .brutal-btn{padding:10px 16px;font-size:11px;box-shadow:4px 4px 0 var(--border);min-height:44px}
  .brutal-btn:hover{transform:none;box-shadow:4px 4px 0 var(--border)}
  .brutal-btn.sm{padding:8px 12px;font-size:10px;min-height:44px}
  .modal-overlay{padding:8px}.modal{width:100%;border-width:3px;box-shadow:5px 5px 0 var(--border)}
  .modal-header{padding:12px 14px}.modal-header h3{font-size:13px}.modal-body{padding:14px}
  .modal-close{width:32px;height:32px;font-size:14px;border-width:2px;min-height:44px;min-width:44px}
  .modal-meta-row{flex-direction:column;gap:12px;margin-bottom:20px}
  .modal-add-comment{flex-direction:column;gap:8px}.modal-add-comment .brutal-input{width:100%}
  .page-login .brutal-card{padding:24px 16px}.login-logo{font-size:28px;letter-spacing:-2px}
  .login-sub{font-size:9px;margin-bottom:24px}.login-field{margin-bottom:14px}
  .settings-wrap h2{font-size:20px;margin-bottom:20px}.settings-col-item{padding:8px 12px;font-size:11px}
  .profile-header{gap:16px;margin-bottom:24px}.profile-avatar{width:72px;height:72px;font-size:28px;box-shadow:5px 5px 0 var(--gold);border-width:3px}
  .profile-info h2{font-size:18px}.profile-pw-section{padding:14px;box-shadow:4px 4px 0 var(--border);border-width:3px}
  .board-avatar{width:28px;height:28px;font-size:9px;border-width:2px;margin-right:-8px}
  .brutal-input{padding:12px 14px;font-size:13px;border-width:3px}
  body{font-size:12px}
}
</style>
<script src="../../api/client.js"></script>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">&#9632; PT</div>
  <button class="nav-btn active" data-tab="login" id="nav-login">Connexion</button>
  <button class="nav-btn" data-tab="dashboard" id="nav-dashboard" style="display:none">Dashboard</button>
  <button class="nav-btn" data-tab="board" id="nav-board" style="display:none">Board</button>
  <button class="nav-btn" data-tab="settings" id="nav-settings" style="display:none">Paramètres</button>
  <button class="nav-btn" data-tab="profile" id="nav-profile" style="display:none">Profil</button>
  <div class="nav-fill"></div>
  <button class="nav-btn logout" id="nav-logout" style="display:none">Déconnexion</button>
</nav>

<div class="page active" id="page-login">
  <div class="brutal-card">
    <div class="login-logo"><span>ProTask</span></div>
    <div class="login-sub">Kanban &#183; Productivit&#233; &#183; &#8734;</div>
    <div class="login-error" id="login-error"></div>
    <form id="login-form" onsubmit="return false">
      <div class="login-field register-fields" id="reg-name-field">
        <label for="reg-name">Nom complet</label>
        <input class="brutal-input" type="text" id="reg-name" placeholder="Jean Dupont">
      </div>
      <div class="login-field">
        <label for="login-email">Email</label>
        <input class="brutal-input" type="email" id="login-email" placeholder="vous@exemple.com">
      </div>
      <div class="login-field register-fields" id="reg-confirm-field">
        <label for="reg-confirm">Confirmer mot de passe</label>
        <input class="brutal-input" type="password" id="reg-confirm" placeholder="&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;">
      </div>
      <div class="login-field">
        <label for="login-password">Mot de passe</label>
        <input class="brutal-input" type="password" id="login-password" placeholder="&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;">
      </div>
      <button class="brutal-btn primary block" style="margin-top:8px" id="login-submit-btn">SE CONNECTER</button>
    </form>
    <div class="login-toggle">
      <span id="login-toggle-text">Pas de compte ? <a id="login-toggle-link">S'inscrire</a></span>
    </div>
  </div>
</div>

<div class="page" id="page-dashboard">
  <div class="dash-header">
    <h1>Mes Boards</h1>
    <button class="brutal-btn gold" id="dash-new-board-btn">+ Nouveau</button>
  </div>
  <hr class="hr">
  <div class="board-grid" id="dash-grid"></div>
</div>

<div class="page" id="page-board">
  <div class="board-top">
    <div class="board-top-left">
      <h2 id="board-title">--</h2>
      <div class="board-avatars" id="board-avatars"></div>
    </div>
    <button class="brutal-btn cyan" id="board-invite-btn">+ Inviter</button>
    <button class="brutal-btn sm" id="board-invitations-btn" style="margin-left:4px">Invitations</button>
  </div>
  <div id="board-invitations-panel" style="display:none;margin-bottom:16px;border:3px solid var(--border);padding:16px;box-shadow:var(--shadow)"></div>
  <div class="board-cols" id="board-cols"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">--</h3>
      <button class="modal-close" id="modal-close-btn">&#10005;</button>
    </div>
    <div class="modal-body">
      <h4>Description</h4>
      <p class="modal-desc" id="modal-desc"></p>
      <div class="modal-meta-row">
        <div><div class="label">Assign&#233; &#224;</div><div class="value" id="modal-assignee">--</div></div>
        <div><div class="label">&#201;ch&#233;ance</div><div class="value" id="modal-due">--</div></div>
        <div><div class="label">Labels</div><div class="value" id="modal-labels">--</div></div>
      </div>
      <hr class="hr">
      <h4>Commentaires</h4>
      <div class="modal-comments" id="modal-comments"></div>
      <div class="modal-add-comment">
        <input class="brutal-input" type="text" id="modal-comment-input" placeholder="Ajouter un commentaire...">

<script>
// ====================== UTILS ======================

const api = demoApi;
const toastEl = document.getElementById('toast');

function showToast(msg, type) {
  toastEl.textContent = msg;
  toastEl.className = 'toast ' + (type || 'success') + ' show';
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 3000);
}

function getInit(str) {
  return str.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
}

function formatDate(str) {
  if (!str) return '';
  return new Date(str + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
}

function showLoading(parent) {
  parent.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:48px;font-weight:900">Chargement...</div>';
}

// ====================== DIALOG ======================

function showDialog(title, opts) {
  return new Promise(resolve => {
    const overlay = document.getElementById('dialog-overlay');
    document.getElementById('dialog-title').textContent = title;
    const msgEl = document.getElementById('dialog-message');
    const inputEl = document.getElementById('dialog-input');
    const isInput = opts && opts.input;
    const isColor = opts && opts.inputType === 'color';
    msgEl.style.display = opts && opts.message ? 'block' : 'none';
    msgEl.textContent = (opts && opts.message) || '';
    inputEl.style.display = isInput ? 'block' : 'none';
    inputEl.type = isColor ? 'color' : 'text';
    if (isInput) { inputEl.value = opts.inputValue || (isColor ? '#000000' : ''); }
    overlay.classList.add('show');
    function cleanup(val) {
      overlay.classList.remove('show');
      document.getElementById('dialog-confirm-btn').onclick = null;
      document.getElementById('dialog-cancel-btn').onclick = null;
      inputEl.onkeydown = null;
      resolve(val);
    }
    document.getElementById('dialog-confirm-btn').onclick = () => {
      if (isColor) { cleanup(inputEl.value); }
      else if (isInput) { const v = inputEl.value.trim(); if (!v) return; cleanup(v); }
      else cleanup(true);
    };
    document.getElementById('dialog-cancel-btn').onclick = () => cleanup(null);
    if (isInput && !isColor) inputEl.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('dialog-confirm-btn').click(); } if (e.key === 'Escape') cleanup(null); };
    else if (!isInput) overlay.onclick = e => { if (e.target === overlay) cleanup(null); };
  });
}

// ====================== STATE ======================

function getUser() { return typeof getCurrentUser === 'function' ? getCurrentUser() : null; }
let activeBoardId = null;
let activeCardId = null;
let activeBoardMembers = [];

// ====================== NAV ======================

const PAGES = {
  login: 'page-login',
  dashboard: 'page-dashboard',
  board: 'page-board',
  settings: 'page-settings',
  profile: 'page-profile',
};

function navigate(tab) {
  const navBtns = document.querySelectorAll('.nav-btn[data-tab]');
  navBtns.forEach(b => b.classList.remove('active'));
  Object.values(PAGES).forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById(PAGES[tab]).classList.add('active');
  const btn = document.querySelector(`.nav-btn[data-tab="${tab}"]`);
  if (btn) btn.classList.add('active');
}

function showAuthUI(isLoggedIn) {
  const show = isLoggedIn ? 'flex' : 'none';
  const hide = isLoggedIn ? 'none' : 'flex';
  document.getElementById('nav-login').style.display = hide;
  document.getElementById('nav-dashboard').style.display = show;
  document.getElementById('nav-board').style.display = show;
  document.getElementById('nav-settings').style.display = show;
  document.getElementById('nav-profile').style.display = show;
  document.getElementById('nav-logout').style.display = show;
}

// ====================== LOGIN ======================

let isRegister = false;
const toggleLink = document.getElementById('login-toggle-link');
const toggleText = document.getElementById('login-toggle-text');
const loginError = document.getElementById('login-error');
const loginSubmitBtn = document.getElementById('login-submit-btn');
const regNameField = document.getElementById('reg-name-field');
const regConfirmField = document.getElementById('reg-confirm-field');

toggleLink.addEventListener('click', () => {
  isRegister = !isRegister;
  loginError.classList.remove('show');
  regNameField.classList.toggle('show', isRegister);
  regConfirmField.classList.toggle('show', isRegister);
  if (isRegister) {
    toggleText.childNodes[0].textContent = 'Déjà un compte ? ';
    toggleLink.textContent = 'Se connecter';
    loginSubmitBtn.textContent = "S'INSCRIRE";
  } else {
    toggleText.childNodes[0].textContent = 'Pas de compte ? ';
    toggleLink.textContent = "S'inscrire";
    loginSubmitBtn.textContent = 'SE CONNECTER';
  }
});

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  loginError.classList.remove('show');
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) { showLoginError('Email et mot de passe requis'); return; }
  try {
    let res;
    if (isRegister) {
      const name = document.getElementById('reg-name').value.trim();
      const confirm = document.getElementById('reg-confirm').value;
      if (!name) { showLoginError('Nom complet requis'); return; }
      if (password !== confirm) { showLoginError('Les mots de passe ne correspondent pas'); return; }
      if (password.length < 8) { showLoginError('Minimum 8 caractères'); return; }
      res = await api.register({ name, email, password });
    } else {
      res = await api.login({ email, password });
    }
    showAuthUI(true);
    navigate('dashboard');
    renderDashboard();
    showToast('Connecté en tant que ' + res.user.name);
  } catch (err) { showLoginError(err.message); }
});

function showLoginError(msg) {
  loginError.textContent = msg;
  loginError.classList.add('show');
}

document.getElementById('nav-logout').addEventListener('click', async () => {
  await api.logout();
  activeBoardId = null;
  document.getElementById('nav-board').textContent = 'Board';
  showAuthUI(false);
  navigate('login');
});

// ====================== NAV BTNS ======================

document.querySelectorAll('.nav-btn[data-tab]').forEach(btn => {
  btn.addEventListener('click', async () => {
    const tab = btn.dataset.tab;
    if (tab === 'dashboard') { renderDashboard(); navigate(tab); }
    else if (tab === 'board') {
      if (!activeBoardId) { showToast('Sélectionnez un board d\'abord', 'error'); return; }
      await renderBoard(activeBoardId);
      navigate(tab);
    } else if (tab === 'settings') {
      if (!activeBoardId) { showToast('Sélectionnez un board d\'abord', 'error'); return; }
      await renderSettings(activeBoardId);
      navigate(tab);
    } else if (tab === 'profile') { await renderProfile(); navigate(tab); }
    else navigate(tab);
  });
});

// ====================== DASHBOARD ======================

async function renderDashboard() {
  const grid = document.getElementById('dash-grid');
  showLoading(grid);
  try {
    const boards = await api.getBoards();
    if (!boards.length) {
      grid.innerHTML = '<div class="empty-state">Aucun board pour le moment. Créez-en un !</div>';
      return;
    }
    grid.innerHTML = boards.map(b => `
      <div class="board-card" data-id="${b.id}">
        <div class="board-card-color" style="background:${b.color || '#000'}"></div>
        <div class="board-card-body">
          <div class="board-card-title">${b.title}</div>
          <div class="board-card-meta">
            <span>&#9679; ${(b.members||[]).length} membres</span>
            <span>&#9632; ${b.cardCount} cartes</span>
          </div>
        </div>
      </div>
    `).join('');
    grid.querySelectorAll('.board-card').forEach(el => {
      el.addEventListener('click', async () => {
        activeBoardId = +el.dataset.id;
        await renderBoard(activeBoardId);
        navigate('board');
      });
    });
  } catch (err) {
    grid.innerHTML = '<div class="empty-state">Erreur : ' + err.message + '</div>';
  }
}

document.getElementById('dash-new-board-btn').addEventListener('click', async () => {
  const title = await showDialog('Nouveau board', { input: true });
  if (!title) return;
  try {
    const board = await api.createBoard({ title: title.trim() });
    activeBoardId = board.id;
    await renderBoard(activeBoardId);
    navigate('board');
    showToast('Board "' + board.title + '" créé');
  } catch (err) { showToast(err.message, 'error'); }
});

// ====================== DRAG & DROP ======================

let dragSrcId = null;
let wasDragged = false;

function setupCardDnD(cardEl) {
  cardEl.addEventListener('dragstart', e => {
    dragSrcId = +cardEl.dataset.cardId;
    wasDragged = false;
    cardEl.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    requestAnimationFrame(() => { wasDragged = true; });
  });
  cardEl.addEventListener('dragend', () => {
    dragSrcId = null;
    document.querySelectorAll('.task-card.dragging').forEach(c => c.classList.remove('dragging'));
    document.querySelectorAll('.col-dropzone.drag-over').forEach(c => c.classList.remove('drag-over'));
    document.querySelectorAll('.task-card.drag-over').forEach(c => c.classList.remove('drag-over'));
  });
}

function setupColumnDnD(colBodyEl, colId) {
  colBodyEl.classList.add('col-dropzone');
  colBodyEl.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    colBodyEl.classList.add('drag-over');
  });
  colBodyEl.addEventListener('dragleave', () => colBodyEl.classList.remove('drag-over'));
  colBodyEl.addEventListener('drop', async e => {
    e.preventDefault();
    colBodyEl.classList.remove('drag-over');
    if (!dragSrcId) return;
    const targetColId = colId;
    const movedCard = await api.moveCard(dragSrcId, targetColId);
    const cards = await api.getCards(targetColId);
    const reorderItems = cards.map((c, i) => ({ id: c.id, order: i }));
    await api.reorderCards(reorderItems);
    await renderBoard(activeBoardId);
    showToast('Carte déplacée');
  });
}

// ====================== BOARD ======================

async function renderBoard(boardId) {
  const colsContainer = document.getElementById('board-cols');
  showLoading(colsContainer);
  try {
    const board = await api.getBoard(boardId);
    document.getElementById('board-title').textContent = board.title;
    document.getElementById('nav-board').textContent = 'Board: ' + board.title;
    const mems = board.members || [];
    activeBoardMembers = mems;
    const avEl = document.getElementById('board-avatars');
    avEl.innerHTML = '';
    mems.slice(0, 3).forEach(m => {
      const div = document.createElement('div');
      div.className = 'board-avatar';
      div.title = m.name;
      div.textContent = getInit(m.name);
      div.style.cursor = 'pointer';
      div.addEventListener('click', async () => {
        const u = await api.getUser(m.id);
        showToast(u.name + ' — ' + u.email);
      });
      avEl.appendChild(div);
    });
    if (mems.length > 3) avEl.innerHTML += `<div class="board-avatar">+${mems.length - 3}</div>`;
    if (!mems.length) avEl.innerHTML = '';
    const bCols = board.columns || [];
    if (!bCols.length) {
      colsContainer.innerHTML = '<div class="empty-state">Aucune colonne dans ce board</div>';
      return;
    }
    colsContainer.innerHTML = bCols.map(c => `
      <div class="board-col" data-col-id="${c.id}">
        <div class="board-col-header">
          <span>&#9632; ${c.title}</span>
          <span class="count" id="col-count-${c.id}">0</span>
          <button class="brutal-btn sm" data-add-card="${c.id}" style="margin-left:auto;padding:4px 10px;font-size:10px">+</button>
        </div>
        <div class="board-col-body" id="col-body-${c.id}"></div>
      </div>
    `).join('');
    for (const col of bCols) {
      await loadColumnCards(col.id);
      const body = document.getElementById('col-body-' + col.id);
      if (body) setupColumnDnD(body, col.id);
    }
    document.querySelectorAll('[data-add-card]').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.stopPropagation();
        const colId = +btn.dataset.addCard;
        const title = await showDialog('Nouvelle carte', { input: true });
        if (title) {
          await api.createCard(colId, { title: title });
          await renderBoard(activeBoardId);
          showToast('Carte créée');
        }
      });
    });
  } catch (err) {
    colsContainer.innerHTML = '<div class="empty-state">Erreur : ' + err.message + '</div>';
  }
}

async function loadColumnCards(colId) {
  try {
    const cards = await api.getCards(colId);
    const body = document.getElementById('col-body-' + colId);
    const countEl = document.getElementById('col-count-' + colId);
    if (!body) return;
    if (countEl) countEl.textContent = cards.length;
    if (!cards.length) {
      body.innerHTML = '<div style="padding:16px;text-align:center;font-weight:700;font-size:11px;text-transform:uppercase;opacity:.4">Aucune carte</div>';
      return;
    }
    body.innerHTML = '';
    for (const card of cards) {
      const tmpl = document.getElementById('tmpl-card').content.cloneNode(true);
      const el = tmpl.firstElementChild;
      el.dataset.cardId = card.id;
      el.addEventListener('click', () => { if (wasDragged) { wasDragged = false; return; } openCardModal(card.id); });
      const labelsEl = el.querySelector('.card-labels');
      const titleEl = el.querySelector('.card-title');
      const footerEl = el.querySelector('.card-footer');
      const avatarEl = el.querySelector('.mini-avatar');
      const nameEl = el.querySelector('.assignee-name');
      const dateEl = el.querySelector('.card-date');
      titleEl.textContent = card.title;
      if (card.labels && card.labels.length) {
        labelsEl.innerHTML = card.labels.map(l => `<span class="card-label" style="background:${l.color}20;border-color:${l.color}">${l.name}</span>`).join('');
      }
      if (card.assignee) {
        avatarEl.textContent = getInit(card.assignee.name);
        nameEl.textContent = card.assignee.name.split(' ')[0];
      } else {
        footerEl.removeChild(footerEl.querySelector('.card-assignee'));
      }
      if (card.dueDate) {
        dateEl.textContent = '&#9679; ' + formatDate(card.dueDate);
      } else {
        dateEl.remove();
      }
      setupCardDnD(el);
      body.appendChild(el);
    }
  } catch (err) {
    const body = document.getElementById('col-body-' + colId);
    if (body) body.innerHTML = '<div style="padding:16px;text-align:center;font-weight:700;color:var(--accent)">Erreur</div>';
  }
}

document.getElementById('board-invite-btn').addEventListener('click', async () => {
  const email = await showDialog('Inviter un membre', { input: true });
  if (!email) return;
  try {
    await api.inviteMember(activeBoardId, email.trim());
    showToast('Invitation envoyée à ' + email.trim());
  } catch (err) { showToast(err.message, 'error'); }
});

document.getElementById('board-invitations-btn').addEventListener('click', async () => {
  try {
    const invs = await api.getInvitations(activeBoardId);
    const pending = invs.filter(i => i.status === 'pending');
    if (!pending.length) { showToast('Aucune invitation en attente', 'error'); return; }
    const panel = document.getElementById('board-invitations-panel');
    panel.innerHTML = '';
    panel.style.display = 'block';
    pending.forEach(inv => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;border:3px solid var(--border);padding:8px 12px;margin-bottom:8px';
      row.innerHTML = '<span style="font-weight:700;font-size:12px">' + inv.email + '</span>';
      const btns = document.createElement('div');
      btns.style.cssText = 'display:flex;gap:6px';
      const accept = document.createElement('button');
      accept.textContent = '✓';
      accept.style.cssText = 'width:32px;height:32px;border:3px solid var(--border);background:var(--green);color:#fff;font-weight:900;cursor:pointer';
      accept.addEventListener('click', async () => {
        await api.acceptInvitation(inv.id);
        showToast('Invitation acceptée');
        panel.style.display = 'none';
      });
      const decline = document.createElement('button');
      decline.textContent = '✕';
      decline.style.cssText = 'width:32px;height:32px;border:3px solid var(--border);background:var(--accent);color:#fff;font-weight:900;cursor:pointer';
      decline.addEventListener('click', async () => {
        await api.respondToInvitation(inv.id, 'declined');
        showToast('Invitation refusée');
        panel.style.display = 'none';
      });
      btns.appendChild(accept);
      btns.appendChild(decline);
      row.appendChild(btns);
      panel.appendChild(row);
    });
  } catch (err) { showToast(err.message, 'error'); }
});

// ====================== MODAL ======================

async function openCardModal(cardId) {
  activeCardId = cardId;
  try {
    const card = await api.getCard(cardId);
    document.getElementById('modal-title').textContent = card.title;
    const labels = await api.getLabels(activeBoardId);
    const cardLabelIds = new Set((card.labels||[]).map(l => l.id));

    const assigneeOpts = activeBoardMembers.map(m =>
      `<option value="${m.id}" ${card.assignee && card.assignee.id === m.id ? 'selected' : ''}>${m.name}</option>`
    ).join('');
    const labelPickerHtml = labels.map(l =>
      `<div class="${cardLabelIds.has(l.id) ? 'checked' : ''}" style="border-color:${l.color};color:${l.color};cursor:pointer" data-label-id="${l.id}">
        ${l.name}
      </div>`
    ).join('');

    const editHtml = `
      <div class="modal-edit" style="margin-bottom:16px">
        <input class="brutal-input" id="modal-edit-title" value="${card.title}" style="margin-bottom:8px">
        <textarea class="brutal-input" id="modal-edit-desc" style="margin-bottom:8px;min-height:60px">${card.description || ''}</textarea>
        <input class="brutal-input" id="modal-edit-due" type="date" value="${card.dueDate || ''}" style="margin-bottom:8px">
        <div class="label" style="margin-top:8px">Assigné à</div>
        <select class="brutal-input" id="modal-edit-assignee" style="margin-bottom:8px">
          <option value="">Non assigné</option>
          ${assigneeOpts}
        </select>
        <div class="label" style="margin:8px 0 4px">Labels</div>
        <div class="label-picker" id="label-picker">${labelPickerHtml}</div>
        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="brutal-btn sm" id="modal-save-btn">Sauvegarder</button>
          <span class="unsaved-indicator" id="unsaved-indicator" style="display:none"><span class="dot"></span> Modifications non sauvegardées</span>
          <button class="brutal-btn sm" id="modal-delete-btn" style="background:var(--accent);color:#fff;margin-left:auto">Supprimer la carte</button>
        </div>
      </div>
    `;

    document.getElementById('modal-desc').innerHTML = editHtml;
    document.getElementById('modal-assignee').textContent = card.assignee ? card.assignee.name : 'Non assigné';
    document.getElementById('modal-due').textContent = card.dueDate ? formatDate(card.dueDate) : 'Non définie';
    document.getElementById('modal-labels').textContent = (card.labels||[]).map(l => l.name).join(', ') || 'Aucun';

    function getSelectedLabelIds() {
      const els = (document.getElementById('label-picker')||document).querySelectorAll('div.checked');
      return Array.from(els).map(el => parseInt(el.dataset.labelId)).filter(n => !isNaN(n));
    }

    const initialData = { title: card.title, description: card.description || '', dueDate: card.dueDate || '', assigneeId: card.assignee ? card.assignee.id : '', labelIds: getSelectedLabelIds() };
    function checkUnsaved() {
      const indicator = document.getElementById('unsaved-indicator');
      if (!indicator) return;
      const title = document.getElementById('modal-edit-title').value;
      const desc = document.getElementById('modal-edit-desc').value;
      const due = document.getElementById('modal-edit-due').value;
      const assignee = document.getElementById('modal-edit-assignee')?.value || '';
      const lid = getSelectedLabelIds();
      const changed = title !== initialData.title || desc !== initialData.description || due !== initialData.dueDate || assignee !== String(initialData.assigneeId) || JSON.stringify(lid) !== JSON.stringify(initialData.labelIds);
      indicator.style.display = changed ? 'inline-flex' : 'none';
    }
    document.getElementById('modal-edit-title').addEventListener('input', checkUnsaved);
    document.getElementById('modal-edit-desc').addEventListener('input', checkUnsaved);
    document.getElementById('modal-edit-due').addEventListener('change', checkUnsaved);
    document.getElementById('modal-edit-assignee').addEventListener('change', checkUnsaved);
    document.getElementById('label-picker').querySelectorAll('div[data-label-id]').forEach(el => {
      el.addEventListener('click', function() {
        this.classList.toggle('checked');
        checkUnsaved();
      });
    });

    document.getElementById('modal-save-btn').addEventListener('click', async () => {
      const title = document.getElementById('modal-edit-title').value.trim();
      const description = document.getElementById('modal-edit-desc').value.trim();
      const dueDate = document.getElementById('modal-edit-due').value || null;
      const assigneeEl = document.getElementById('modal-edit-assignee');
      const assigneeId = assigneeEl ? parseInt(assigneeEl.value) || null : undefined;
      const labelIds = getSelectedLabelIds();
      if (!title) { showToast('Titre requis', 'error'); return; }
      await api.updateCard(cardId, { title, description, dueDate, assigneeId, labels: labelIds });
      document.getElementById('unsaved-indicator').style.display = 'none';
      showToast('Carte mise à jour');
      await openCardModal(cardId);
    });

    document.getElementById('modal-delete-btn').addEventListener('click', async () => {
      const ok = await showDialog('Confirmation', { message: 'Supprimer cette carte ?' });
      if (!ok) return;
      await api.deleteCard(cardId);
      closeModal();
      await renderBoard(activeBoardId);
      showToast('Carte supprimée');
    });

    const commentsEl = document.getElementById('modal-comments');
    commentsEl.innerHTML = '';
    if (!card.comments || !card.comments.length) {
      commentsEl.innerHTML = '<div class="modal-comment"><div class="modal-comment-author">Système</div><div class="modal-comment-text">Aucun commentaire pour cette tâche.</div></div>';
    } else {
      for (const cm of card.comments) {
        const t = document.getElementById('tmpl-comment').content.cloneNode(true);
        t.querySelector('.modal-comment-author').textContent = (cm.author ? cm.author.name : 'Utilisateur inconnu') + ' • ' + new Date(cm.createdAt).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
        t.querySelector('.modal-comment-text').textContent = cm.text;
        const delBtn = document.createElement('button');
        delBtn.textContent = '✕';
        delBtn.style.cssText = 'border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:10px;padding:2px 6px;margin-top:4px';
        delBtn.addEventListener('click', async () => {
          await api.deleteComment(cm.id);
          showToast('Commentaire supprimé');
          await openCardModal(cardId);
        });
        t.querySelector('.modal-comment').appendChild(delBtn);
        commentsEl.appendChild(t);
      }
    }
    document.getElementById('modal-overlay').classList.add('show');
  } catch (err) { showToast(err.message, 'error'); }
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
  activeCardId = null;
}

document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.getElementById('modal-close-btn').addEventListener('click', closeModal);

document.getElementById('modal-comment-btn').addEventListener('click', addComment);
document.getElementById('modal-comment-input').addEventListener('keydown', e => { if (e.key === 'Enter') addComment(); });

async function addComment() {
  const input = document.getElementById('modal-comment-input');
  const text = input.value.trim();
  if (!text || !activeCardId) return;
  try {
    await api.addComment(activeCardId, { text });
    input.value = '';
    const comments = await api.getComments(activeCardId);
    const el = document.getElementById('modal-comments');
    el.innerHTML = '';
    for (const cm of comments) {
      const t = document.getElementById('tmpl-comment').content.cloneNode(true);
      t.querySelector('.modal-comment-author').textContent = (cm.author ? cm.author.name : 'Utilisateur inconnu') + ' • ' + new Date(cm.createdAt).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
      t.querySelector('.modal-comment-text').textContent = cm.text;
      el.appendChild(t);
    }
    showToast('Commentaire ajouté');
  } catch (err) { showToast(err.message, 'error'); }
}

// ====================== SETTINGS ======================

async function renderSettings(boardId) {
  try {
    const board = await api.getBoard(boardId);
    const cols = board.columns || [];
    const labels = await api.getLabels(boardId);
    document.getElementById('settings-board-name').value = board.title;
    document.getElementById('settings-board-desc').value = board.description || '';
    const colList = document.getElementById('settings-col-list');
    colList.innerHTML = '';
    cols.forEach((col, i) => {
      const t = document.getElementById('tmpl-settings-col').content.cloneNode(true);
      const el = t.firstElementChild;
      el.querySelector('.col-title').textContent = '&#9632; ' + col.title;
      const editBtn = el.querySelector('.col-edit');
      const delBtn = el.querySelector('.col-del');
      const upBtn = document.createElement('button');
      upBtn.textContent = '▲';
      upBtn.title = 'Monter';
      upBtn.style.cssText = 'width:30px;height:30px;border:3px solid var(--border);background:var(--gold);font-weight:900;cursor:pointer;font-family:inherit;font-size:12px';
      upBtn.addEventListener('click', async (e) => { e.stopPropagation();
        const siblings = [...colList.querySelectorAll('.settings-col-item')];
        const idx = siblings.indexOf(el);
        if (idx > 0) {
          const items = cols.map((c, i) => ({ id: c.id, order: i === idx ? idx - 1 : i === idx - 1 ? idx : i }));
          await api.reorderColumns(items);
          await renderSettings(boardId);
          showToast('Colonne déplacée');
        }
      });
      el.querySelector('.col-actions').prepend(upBtn);
      const downBtn = document.createElement('button');
      downBtn.textContent = '▼';
      downBtn.title = 'Descendre';
      downBtn.style.cssText = 'width:30px;height:30px;border:3px solid var(--border);background:var(--cyan);font-weight:900;cursor:pointer;font-family:inherit;font-size:12px';
      downBtn.addEventListener('click', async (e) => { e.stopPropagation();
        const siblings = [...colList.querySelectorAll('.settings-col-item')];
        const idx = siblings.indexOf(el);
        if (idx < siblings.length - 1) {
          const items = cols.map((c, i) => ({ id: c.id, order: i === idx ? idx + 1 : i === idx + 1 ? idx : i }));
          await api.reorderColumns(items);
          await renderSettings(boardId);
          showToast('Colonne déplacée');
        }
      });
      el.querySelector('.col-actions').prepend(downBtn);
      editBtn.addEventListener('click', async () => {
        const t = await showDialog('Renommer la colonne', { input: true, inputValue: col.title });
        if (t) { await api.updateColumn(col.id, { title: t }); await renderSettings(boardId); showToast('Colonne renommée'); }
      });
      delBtn.addEventListener('click', async () => {
        const ok = await showDialog('Confirmation', { message: 'Supprimer "' + col.title + '" ?' });
        if (ok) { await api.deleteColumn(col.id); await renderSettings(boardId); showToast('Colonne supprimée'); }
      });
      colList.appendChild(el);
    });
    const labelList = document.getElementById('settings-label-list');
    labelList.innerHTML = '';
    labels.forEach(l => {
      const t = document.getElementById('tmpl-settings-label').content.cloneNode(true);
      const el = t.firstElementChild;
      el.querySelector('.color-swatch').style.background = l.color;
      el.querySelector('.label-name').textContent = l.name;
      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex;gap:6px;margin-left:auto';
      const editLbl = document.createElement('button');
      editLbl.textContent = '✎';
      editLbl.style.cssText = 'width:28px;height:28px;border:2px solid var(--border);background:var(--gold);font-weight:900;cursor:pointer;font-size:12px';
      editLbl.addEventListener('click', async () => {
        const n = await showDialog('Nom du label', { input: true, inputValue: l.name });
        if (!n) return;
        const c = await showDialog('Couleur du label', { input: true, inputValue: l.color });
        if (!c) return;
        await api.updateLabel(l.id, { name: n, color: c });
        await renderSettings(boardId);
        showToast('Label mis à jour');
      });
      const delLbl = document.createElement('button');
      delLbl.textContent = '✕';
      delLbl.style.cssText = 'width:28px;height:28px;border:2px solid var(--border);background:var(--accent);color:#fff;font-weight:900;cursor:pointer;font-size:12px';
      delLbl.addEventListener('click', async () => {
        await api.deleteLabel(l.id);
        await renderSettings(boardId);
        showToast('Label supprimé');
      });
      actions.appendChild(editLbl);
      actions.appendChild(delLbl);
      el.appendChild(actions);
      labelList.appendChild(el);
    });
  } catch (err) { showToast(err.message, 'error'); }
}

document.getElementById('settings-save-btn').addEventListener('click', async () => {
  if (!activeBoardId) { showToast('Aucun board sélectionné', 'error'); return; }
  const title = document.getElementById('settings-board-name').value.trim();
  if (!title) { showToast('Le nom du board est requis', 'error'); return; }
  try {
    await api.updateBoard(activeBoardId, { title, description: document.getElementById('settings-board-desc').value.trim() });
    showToast('Board mis à jour');
  } catch (err) { showToast(err.message, 'error'); }
});

document.getElementById('settings-add-col').addEventListener('click', async () => {
  const title = await showDialog('Nouvelle colonne', { input: true });
  if (!title) return;
  try {
    await api.createColumn(activeBoardId, { title: title.trim() });
    await renderSettings(activeBoardId);
    showToast('Colonne ajoutée');
  } catch (err) { showToast(err.message, 'error'); }
});

document.getElementById('settings-add-label').addEventListener('click', async () => {
  const name = await showDialog('Nouveau label', { input: true });
  if (!name) return;
  const color = await showDialog('Couleur du label', { input: true, inputType: 'color', inputValue: '#4F46E5' });
  if (!color) return;
  try {
    await api.createLabel(activeBoardId, { name: name.trim(), color: color.trim() });
    await renderSettings(activeBoardId);
    showToast('Label ajouté');
  } catch (err) { showToast(err.message, 'error'); }
});

document.getElementById('settings-del-board-btn').addEventListener('click', async () => {
  if (!activeBoardId) return;
  const ok = await showDialog('Confirmation', { message: 'Supprimer définitivement ce board et toutes ses données ?' });
  if (!ok) return;
  try {
    await api.deleteBoard(activeBoardId);
    activeBoardId = null;
    document.getElementById('nav-board').textContent = 'Board';
    navigate('dashboard');
    renderDashboard();
    showToast('Board supprimé');
  } catch (err) { showToast(err.message, 'error'); }
});

// ====================== PROFILE ======================

async function renderProfile() {
  try { await api.getMe(); } catch (e) { /* ignore */ }
  const user = getUser();
  if (!user) return;
  document.getElementById('profile-avatar').textContent = getInit(user.name);
  document.getElementById('profile-name-display').textContent = user.name;
  document.getElementById('profile-email-display').textContent = user.email;
  document.getElementById('profile-name').value = user.name;
  document.getElementById('profile-email').value = user.email;
  ['profile-pw-current','profile-pw-new','profile-pw-confirm'].forEach(id => document.getElementById(id).value = '');
}

document.getElementById('profile-save-btn').addEventListener('click', async () => {
  const user = getUser();
  if (!user) return;
  const name = document.getElementById('profile-name').value.trim();
  const email = document.getElementById('profile-email').value.trim();
  if (!name || !email) { showToast('Nom et email requis', 'error'); return; }
  const data = { name, email };
  const pwCur = document.getElementById('profile-pw-current').value;
  const pwNew = document.getElementById('profile-pw-new').value;
  const pwCfm = document.getElementById('profile-pw-confirm').value;
  if (pwCur || pwNew || pwCfm) {
    if (!pwCur) { showToast('Mot de passe actuel requis', 'error'); return; }
    if (pwNew !== pwCfm) { showToast('Les nouveaux mots de passe ne correspondent pas', 'error'); return; }
    if (pwNew.length < 8) { showToast('Minimum 8 caractères', 'error'); return; }
    data.password = pwNew;
  }
  try {
    await api.updateMe(data);
    renderProfile();
    showToast('Profil mis à jour');
  } catch (err) { showToast(err.message, 'error'); }
});
</script>
